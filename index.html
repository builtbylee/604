      // Pool: 360 enter pool, 171 removed via S104 = 189 remaining
      this.assertExact(result.finalPool.qty, 189, 'Pool qty = 189 (360 - 171 from S104)');
      this.assertExact(EngineInvariants.errors.length, 0, 'No engine errors');
    });

    // ===== TEST 12: Missing-basis blocked test =====
    this.runCase('12. Missing-basis blocked test', () => {
      EngineInvariants.reset();
      const txns = [
        { date: '2024-07-01', type: 'disposal', subtype: 'voluntary', qty: 100, gbpProceeds: 5000 * 100 },
      ];
      const result = this.makeSyntheticPool(txns, testRates);

      this.assert(EngineInvariants.errors.length > 0, 'Engine errors triggered', '>0', EngineInvariants.errors.length);
      const hasPoolViolation = EngineInvariants.errors.some(e => e.includes('negative') || e.includes('pool'));
      this.assert(hasPoolViolation, 'Error includes pool-non-negative violation', true, hasPoolViolation);

      // Computation completes without crash
      this.assert(result.disposals.length === 1, 'Computation completed', 1, result.disposals.length);
    });

    // ===== TEST 13: 2024/25 pre/post budget rate split =====
    this.runCase('13. 2024/25 pre/post budget rate split', () => {
      EngineInvariants.reset();

      // Pre-budget gain: 2024-08-01
      // Post-budget gain: 2024-12-01
      const fakeDisposals = [
        { taxYear: '2024/25', gainLoss: 200000, disposal: { date: '2024-08-01' }, matches: [] },
        { taxYear: '2024/25', gainLoss: 800000, disposal: { date: '2024-12-01' }, matches: [] },
      ];
      // Total gains = 1000000 (£10,000), AEA = 300000 (£3,000), taxable = 700000 (£7,000)
      const cgt = CGTCalc.compute(fakeDisposals, '2024/25', 0);

      this.assertExact(cgt.grossGains, 1000000, 'Gross gains = £10,000');
      this.assertExact(cgt.taxableGains, 700000, 'Taxable gains = £7,000');

      // Pre-budget taxable = min(200000, 700000) = 200000
      // Post-budget taxable = 700000 - 200000 = 500000
      // CGT = 200000 * 20/100 + 500000 * 24/100 = 40000 + 120000 = 160000
      this.assertExact(cgt.cgtDue, 160000, 'CGT due = £1,600');

      // Base CGT = 700000 * 20/100 = 140000
      this.assertExact(cgt.baseCgt, 140000, 'Base CGT = £1,400');

      // Budget adjustment = 160000 - 140000 = 20000
      this.assertExact(cgt.budgetAdjustment, 20000, 'Budget adjustment = £200');

      // Verify NOT proportional allocation:
      // Proportional would give: pre = 700000 * 200000/1000000 = 140000, post = 560000
      // That would produce: 140000*20% + 560000*24% = 28000 + 134400 = 162400
      this.assert(cgt.cgtDue !== 162400, 'NOT proportional allocation', 'not 162400', cgt.cgtDue);
    });

    // ===== FX rate conversion consistency (bundled as test 14) =====
    this.runCase('14. FX rate conversion consistency', () => {
      EngineInvariants.reset();

      // Two disposals in same tax year use same rate
      const usdGain1 = 100000; // $1000 gain in cents
      const gbp1 = usdToGbp(usdGain1, '2024/25');
      const gbp2 = usdToGbp(usdGain1, '2024/25');
      this.assertExact(gbp1, gbp2, 'Same tax year: identical FX conversion');

      // Two disposals in different tax years use different rates
      const gbp3 = usdToGbp(usdGain1, '2023/24');
      this.assert(gbp1 !== gbp3, 'Different tax years: different FX conversion', 'different', gbp1 === gbp3 ? 'same' : 'different');

      // Test rate < 1 (GBP/USD format) - should multiply directly
      const rate2223 = HMRC_RATES['2022/23']; // 0.8202
      const gbpDirect = usdToGbp(100000, '2022/23');
      this.assertExact(gbpDirect, roundPence(100000 * rate2223),
        'Rate < 1: direct multiply');

      // Test rate > 1 (USD/GBP format) - should flip to 1/rate
      // Temporarily inject a >1 rate for testing
      const testRate = 1.2705;
      HMRC_RATES['_test_year'] = testRate;
      const gbpFlipped = usdToGbp(100000, '_test_year');
      this.assertExact(gbpFlipped, roundPence(100000 * (1 / testRate)),
        'Rate > 1: flipped to 1/rate');
      delete HMRC_RATES['_test_year'];
    });

    return {
      results: this.results,
      pass: this.pass,
      fail: this.fail,
      total: this.pass + this.fail,
    };
  }
};
// ========== FILE IMPORTER ==========
const FileImporter = {
  // Severity levels
  SEVERITY: { AUTO_FIXED: 'auto-fixed', WARNING: 'warning', ERROR: 'error' },

  /**
   * Main entry point. Accepts a File object, returns a parsed result with
   * validation report ready for user review.
   */
  async parse(file) {
    const issues = [];
    const ext = (file.name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || '';

    let rows, headers;

    if (ext === 'xlsx' || ext === 'xls') {
      const result = await this._readExcel(file, issues);
      rows = result.rows;
      headers = result.headers;
    } else {
      const result = await this._readCSV(file);
      rows = result.rows;
      headers = result.headers;
    }

    if (!headers || headers.length === 0) {
      return { ok: false, issues: [{ severity: this.SEVERITY.ERROR, message: 'Could not read any data from this file.' }], transactions: [], file };
    }

    // Detect schema
    const schema = this._detectSchema(headers);

    // Extract transactions based on schema
    let transactions;
    if (schema === 'gl_expanded') {
      transactions = this._parseGLExpanded(headers, rows, issues);
    } else if (schema === 'benefit_history') {
      transactions = this._parseBenefitHistory(headers, rows, issues);
    } else {
      transactions = this._parseGenericCSV(headers, rows, issues);
    }

    // Validate all transactions
    this._validate(transactions, issues);

    // Detect duplicates against existing TRANSACTIONS
    this._detectDuplicates(transactions, issues);

    // Apply date cutoff: exclude transactions covered by existing pool data
    const cutoffDate = this._applyDateCutoff(transactions, issues);

    const hasErrors = issues.some(i => i.severity === this.SEVERITY.ERROR);
    const newCount = transactions.filter(t => !t._duplicate && !t._coveredByPool).length;
    const skipCount = transactions.filter(t => t._duplicate || t._coveredByPool).length;

    return {
      ok: !hasErrors,
      file,
      schema,
      schemaLabel: schema === 'gl_expanded' ? 'E*TRADE Gains & Losses (Expanded)'
                 : schema === 'benefit_history' ? 'E*TRADE Benefit History'
                 : 'Generic CSV/Text',
      issues,
      transactions,
      newCount,
      skipCount,
      hasErrors,
      cutoffDate,
    };
  },

  // ---- File readers ----

  async _readExcel(file, issues) {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];

    // Also read with raw:true to detect date corruption
    const rawWorkbook = XLSX.read(data, { type: 'array', cellDates: false, raw: true });
    const rawSheet = rawWorkbook.Sheets[sheetName];

    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    const rawJsonData = XLSX.utils.sheet_to_json(rawSheet, { header: 1, defval: '' });

    if (jsonData.length < 2) {
      return { headers: [], rows: [] };
    }

    const headers = jsonData[0].map(h => String(h).trim());
    const rows = [];
    let dateCorruptionFixed = 0;

    for (let r = 1; r < jsonData.length; r++) {
      const row = {};
      const rawRow = rawJsonData[r] || [];
      for (let c = 0; c < headers.length; c++) {
        let val = jsonData[r]?.[c];
        const rawVal = rawRow[c];
        const hdr = headers[c];

        // Detect Excel date corruption in price/value columns
        if (this._isPriceColumn(hdr) && val instanceof Date) {
          // Recover the original number from the Excel serial date
          const recovered = this._recoverFromExcelDate(val);
          if (recovered !== null) {
            val = recovered;
            dateCorruptionFixed++;
          }
        }
        // Also check if raw value is a number but formatted value looks like a date string
        if (this._isPriceColumn(hdr) && typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)) {
          // The raw value should be a number (Excel serial date number)
          if (typeof rawVal === 'number') {
            val = rawVal;
            dateCorruptionFixed++;
          }
        }

        row[hdr] = val;
      }
      rows.push(row);
    }

    if (dateCorruptionFixed > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${dateCorruptionFixed} value(s) in price columns were corrupted by Excel date formatting -- recovered automatically.`
      });
    }

    return { headers, rows };
  },

  async _readCSV(file) {
    const text = await file.text();
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) return { headers: [], rows: [] };

    const headers = this._parseCSVLine(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const fields = this._parseCSVLine(lines[i]);
      const row = {};
      headers.forEach((h, idx) => { row[h] = fields[idx] || ''; });
      rows.push(row);
    }
    return { headers, rows };
  },

  _parseCSVLine(line) {
    const fields = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === ',' && !inQuotes) { fields.push(current.trim()); current = ''; }
      else { current += ch; }
    }
    fields.push(current.trim());
    return fields;
  },

  // ---- Schema detection ----

  _detectSchema(headers) {
    const lower = headers.map(h => h.toLowerCase());
    // G&L_Expanded: has "Record Type", "Date Acquired", "Date Sold", "Proceeds Per Share"
    if (lower.some(h => h.includes('record type')) &&
        lower.some(h => h.includes('date sold') || h.includes('date acquired'))) {
      return 'gl_expanded';
    }
    // BenefitHistory: has "Event Type", "Qty. or Amount"
    if (lower.some(h => h.includes('event type')) &&
        lower.some(h => h.includes('qty') || h.includes('amount'))) {
      return 'benefit_history';
    }
    return 'generic';
  },

  // ---- G&L Expanded parser ----
  // The G&L file contains one row per SALE (disposal). Each row also carries
  // the vest date and vest FMV, which tells us the ACQUISITION that sourced
  // the shares. The parser generates BOTH an acquisition and a disposal
  // from each row, then deduplicates acquisitions (multiple lots vest on the
  // same date at the same FMV).

  _parseGLExpanded(headers, rows, issues) {
    const col = (name) => {
      const lower = name.toLowerCase();
      return headers.find(h => h.toLowerCase().includes(lower)) || null;
    };

    const recordTypeCol = col('record type');
    const symbolCol = col('symbol');
    const dateAcquiredCol = col('date acquired');
    const dateSoldCol = col('date sold');
    const qtyCol = col('qty') || col('quantity') || col('shares sold') || col('shares');
    const proceedsPerShareCol = col('proceeds per share');
    const acqCostPerShareCol = col('acquisition cost per share') || col('acq cost per share');
    const vestFMVCol = col('vest date fmv') || col('vest fmv') || col('fair market value');
    const grantCol = col('grant') || col('grant number') || col('grant id');
    const totalProceedsCol = col('total proceeds') || col('proceeds');
    const totalCostCol = col('total cost') || col('cost basis') || col('total acquisition cost');
    // Order Type column: "RS STC", "Sell Restricted Stock", "Same-Day Sale" etc.
    const orderTypeCol = col('order type');
    // Grant Price column: used for options exercise price
    const grantPriceCol = col('grant price');
    const vestDateCol = col('vest date');
    const exerciseDateCol = col('exercise date');

    let fractionalFixed = 0;
    const rawDisposals = [];
    const rawAcquisitions = []; // acquisitions derived from vest data
    const seenVestings = new Map(); // dedup: "vestDate|vestPrice" -> aggregated qty

    for (const row of rows) {
      const recordType = String(row[recordTypeCol] || '').trim();
      if (!recordType || recordType.toUpperCase() === 'SUMMARY' ||
          recordType.toUpperCase() === 'HEADER' || recordType.toUpperCase() === 'FOOTER') continue;

      const dateAcquired = this._normalizeDate(row[dateAcquiredCol]);
      const dateSold = this._normalizeDate(row[dateSoldCol]);
      const rawQty = this._parseNumber(row[qtyCol]);
      const qty = Math.round(rawQty);
      if (Math.abs(rawQty - qty) > 0.0001 && rawQty > 0) fractionalFixed++;
      if (qty <= 0) continue;

      let vestPrice = this._parseNumber(row[vestFMVCol]);
      let acqCostPerShare = this._parseNumber(row[acqCostPerShareCol]);
      const proceedsPerShare = this._parseNumber(row[proceedsPerShareCol]);
      const totalProceeds = this._parseNumber(row[totalProceedsCol]);
      const grantPrice = this._parseNumber(row[grantPriceCol]);
      const orderType = String(row[orderTypeCol] || '').trim();

      // If acquisition cost is 0 for RSU, use vest FMV
      if (acqCostPerShare === 0 && vestPrice > 0) {
        acqCostPerShare = vestPrice;
      }

      // Classify using the Order Type column (not Record Type which is always "Sell")
      let classification;
      const orderLower = orderType.toLowerCase();
      if (orderLower.includes('stc') || orderLower.includes('sell to cover') ||
          orderLower.includes('rs stc')) {
        classification = 'STC Sale';
      } else if (orderLower.includes('same-day') || orderLower.includes('same day') ||
                 orderLower.includes('exercise')) {
        classification = 'Option Exercise (Same-Day Sale)';
      } else if (orderLower.includes('sell') || orderLower.includes('sale') ||
                 orderLower.includes('sold') || recordType.toLowerCase() === 'sell') {
        classification = 'Voluntary Sale';
      } else {
        // Fallback: if it has a sale date and proceeds, it's a sale
        classification = dateSold && proceedsPerShare > 0 ? 'Voluntary Sale' : 'unknown';
      }

      // ---- Create DISPOSAL record ----
      if (dateSold && proceedsPerShare > 0) {
        rawDisposals.push({
          dateAcquired,
          dateSold,
          qty,
          vestPrice,
          acqCostPerShare,
          proceedsPerShare,
          totalProceeds: totalProceeds || (qty * proceedsPerShare),
          classification,
          grant: String(row[grantCol] || ''),
          symbol: String(row[symbolCol] || ''),
          grantPrice,
          orderType,
        });
      }

      // ---- Track ACQUISITION (vesting) ----
      // Each sale row tells us shares were acquired on dateAcquired at vestPrice.
      // We aggregate by vest date + vest price to avoid creating duplicate vestings.
      // Skip option exercises (they have a different acquisition mechanic).
      if (dateAcquired && vestPrice > 0 && classification !== 'Option Exercise (Same-Day Sale)') {
        const vestKey = `${dateAcquired}|${Math.round(vestPrice * 100)}`;
        const existing = seenVestings.get(vestKey);
        if (existing) {
          existing.qty += qty;
        } else {
          seenVestings.set(vestKey, {
            dateAcquired,
            vestPrice,
            qty,
            symbol: String(row[symbolCol] || ''),
          });
        }
      }
    }

    if (fractionalFixed > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${fractionalFixed} quantit${fractionalFixed === 1 ? 'y' : 'ies'} contained fractional shares (e.g. 46.001) -- rounded to nearest whole number.`
      });
    }

    // Aggregate disposal lots by date + classification
    const aggregatedDisposals = this._aggregateLots(rawDisposals, issues);

    // Build output transactions: acquisitions first, then disposals
    const transactions = [];

    // Acquisitions from vest data
    for (const [, v] of seenVestings) {
      transactions.push({
        date: v.dateAcquired,
        type: 'acquisition',
        subtype: 'RSU',
        qty: v.qty,
        usdPricePerShare: Math.round(v.vestPrice * 100),
        gbpCost: Math.round(v.qty * v.vestPrice * 100), // USD value as placeholder
        classification: 'RSU Vesting',
        notes: 'Vesting from ' + v.symbol,
      });
    }

    // Disposals
    for (const t of aggregatedDisposals) {
      const isOptionExercise = t.classification === 'Option Exercise (Same-Day Sale)';
      let subtype;
      if (t.classification === 'STC Sale') subtype = 'STC';
      else if (isOptionExercise) subtype = 'voluntary';
      else subtype = 'voluntary';

      const disposal = {
        date: t.dateSold || t.dateAcquired,
        type: 'disposal',
        subtype,
        qty: t.qty,
        gbpCost: 0,
        gbpProceeds: Math.round(t.totalProceeds * 100),
        classification: t.classification,
        notes: isOptionExercise
          ? `Options exercised at $${t.grantPrice?.toFixed(2) || '2.79'}, sold same day`
          : 'Sale from ' + (t.symbol || 'NET'),
        _vestDate: t.dateAcquired,
        _vestPrice: t.acqCostPerShare || t.vestPrice,
        _salePrice: t.proceedsPerShare,
      };

      // For option exercises: also create the acquisition (exercise)
      if (isOptionExercise) {
        const exercisePrice = t.proceedsPerShare || 0; // same-day: acq at market value
        transactions.push({
          date: t.dateSold || t.dateAcquired,
          type: 'acquisition',
          subtype: 'RSU', // enters pool like RSU
          qty: t.qty,
          usdPricePerShare: Math.round(exercisePrice * 100),
          gbpCost: Math.round(t.qty * exercisePrice * 100),
          classification: 'Option Exercise',
          notes: `Options exercised: ${t.qty} shares at market $${exercisePrice.toFixed(2)}`,
        });
      }

      transactions.push(disposal);
    }

    // Report what we found
    const acqCount = transactions.filter(t => t.type === 'acquisition').length;
    const dispCount = transactions.filter(t => t.type === 'disposal').length;
    if (acqCount > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `Extracted ${acqCount} acquisition(s) and ${dispCount} disposal(s) from ${rows.length} sale rows.`
      });
    }

    return transactions;
  },

  // ---- Benefit History parser ----

  _parseBenefitHistory(headers, rows, issues) {
    const col = (name) => {
      const lower = name.toLowerCase();
      return headers.find(h => h.toLowerCase().includes(lower)) || null;
    };

    const eventTypeCol = col('event type');
    // Prefer exact "Date" column over "Grant Date", "Vest Date", etc.
    const dateCol = headers.find(h => h.trim().toLowerCase() === 'date')
                 || col('event date') || col('date');
    // Prefer "Qty. or Amount" (the event qty column) over "Granted Qty." etc.
    const qtyCol = headers.find(h => h.toLowerCase().includes('qty. or amount'))
                || headers.find(h => h.trim().toLowerCase() === 'qty' || h.trim().toLowerCase() === 'quantity')
                || col('qty') || col('quantity') || col('amount');
    const priceCol = col('price') || col('fmv') || col('fair market value');

    let fractionalFixed = 0;
    const transactions = [];
    let missingPrices = 0;

    for (const row of rows) {
      const eventType = String(row[eventTypeCol] || '').trim().toLowerCase();
      if (!eventType) continue;

      const date = this._normalizeDate(row[dateCol]);
      const rawQty = this._parseNumber(row[qtyCol]);
      const qty = Math.round(rawQty);
      if (Math.abs(rawQty - qty) > 0.0001 && rawQty > 0) fractionalFixed++;
      if (qty <= 0) continue;

      const price = this._parseNumber(row[priceCol]);

      // Only count "vested" events, not "released" (which duplicates the same data)
      if (eventType.includes('vest') || eventType.includes('lapse')) {
        // Skip "released" events -- they duplicate "vested" events
        if (eventType.includes('release') && !eventType.includes('vest')) continue;
        if (price === 0) missingPrices++;
        transactions.push({
          date,
          type: 'acquisition',
          subtype: 'RSU',
          qty,
          usdPricePerShare: Math.round(price * 100),
          gbpCost: 0,
          classification: 'RSU Vesting',
          notes: 'Imported from Benefit History',
          _raw: row,
        });
      }
    }

    // Aggregate vestings by date (multiple grants may vest on same date)
    const vestByDate = new Map();
    const nonVest = [];
    for (const t of transactions) {
      if (t.type === 'acquisition' && t.date) {
        const key = t.date;
        const existing = vestByDate.get(key);
        if (existing) {
          existing.qty += t.qty;
        } else {
          vestByDate.set(key, { ...t });
        }
      } else {
        nonVest.push(t);
      }
    }
    const aggregated = [...vestByDate.values(), ...nonVest];
    if (transactions.length > aggregated.length) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${transactions.length - aggregated.length} vesting event(s) from multiple grants on the same date were aggregated.`
      });
    }

    if (fractionalFixed > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${fractionalFixed} quantit${fractionalFixed === 1 ? 'y' : 'ies'} contained fractional shares -- rounded to nearest whole number.`
      });
    }
    if (missingPrices > 0) {
      issues.push({
        severity: this.SEVERITY.WARNING,
        message: `${missingPrices} vesting event(s) have no price/FMV. You will need to add vest prices manually before import is complete.`
      });
    }

    return aggregated;
  },

  // ---- Generic CSV parser ----

  _parseGenericCSV(headers, rows, issues) {
    const lower = headers.map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const dateIdx = lower.findIndex(h => h.includes('date') || h.includes('tradedate'));
    const typeIdx = lower.findIndex(h => h.includes('type') || h.includes('transaction'));
    const qtyIdx = lower.findIndex(h => h.includes('qty') || h.includes('quantity') || h.includes('shares'));
    const priceIdx = lower.findIndex(h => h.includes('price'));
    const amountIdx = lower.findIndex(h => h.includes('amount') || h.includes('proceeds') || h.includes('total'));
    const symbolIdx = lower.findIndex(h => h.includes('symbol') || h.includes('ticker'));

    if (dateIdx === -1) {
      issues.push({ severity: this.SEVERITY.ERROR, message: 'No date column found. Cannot parse this file.' });
      return [];
    }

    let fractionalFixed = 0;
    const transactions = [];

    for (const row of rows) {
      const vals = headers.map(h => row[h]);
      const rawType = String(vals[typeIdx] || '').toLowerCase();
      const rawQty = Math.abs(this._parseNumber(vals[qtyIdx]));
      const qty = Math.round(rawQty);
      if (Math.abs(rawQty - qty) > 0.0001 && rawQty > 0) fractionalFixed++;
      if (qty <= 0) continue;

      const price = Math.abs(this._parseNumber(vals[priceIdx]));
      const amount = Math.abs(this._parseNumber(vals[amountIdx]));
      const symbol = String(vals[symbolIdx] || '');

      let classification = 'unknown';
      if (rawType.includes('vest') || rawType.includes('lapse') || rawType.includes('release')) {
        classification = 'RSU Vesting';
      } else if (rawType.includes('sell') && rawType.includes('cover')) {
        classification = 'STC Sale';
      } else if (rawType.includes('sold') || rawType.includes('sell') || rawType.includes('sale')) {
        classification = 'Voluntary Sale';
      }

      const date = this._normalizeDate(vals[dateIdx]);

      if (classification === 'RSU Vesting') {
        transactions.push({
          date, type: 'acquisition', subtype: 'RSU',
          qty, usdPricePerShare: Math.round(price * 100),
          gbpCost: 0, classification,
          notes: 'Imported from CSV' + (symbol ? ` (${symbol})` : ''),
          _raw: row,
        });
      } else if (classification !== 'unknown') {
        const subtype = classification === 'STC Sale' ? 'STC' : 'voluntary';
        const proceeds = amount > 0 ? amount : qty * price;
        transactions.push({
          date, type: 'disposal', subtype,
          qty, gbpCost: 0, gbpProceeds: Math.round(proceeds * 100),
          classification,
          notes: 'Imported from CSV' + (symbol ? ` (${symbol})` : ''),
          _salePrice: price,
          _raw: row,
        });
      } else {
        transactions.push({
          date, type: 'unknown', qty, price, amount, symbol,
          classification: 'unknown',
          rawType: vals[typeIdx] || '',
          notes: 'Unclassified',
          _raw: row,
        });
      }
    }

    if (fractionalFixed > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${fractionalFixed} quantit${fractionalFixed === 1 ? 'y' : 'ies'} contained fractional shares -- rounded to nearest whole number.`
      });
    }

    return transactions;
  },

  // ---- Lot aggregation ----

  _aggregateLots(rawTransactions, issues) {
    // Group disposals by sale date + classification
    const key = (t) => `${t.dateSold || t.dateAcquired}|${t.classification}`;
    const groups = {};
    for (const t of rawTransactions) {
      const k = key(t);
      if (!groups[k]) groups[k] = [];
      groups[k].push(t);
    }

    let aggregatedCount = 0;
    const result = [];
    for (const [, group] of Object.entries(groups)) {
      if (group.length === 1) {
        result.push(group[0]);
      } else {
        aggregatedCount++;
        const merged = { ...group[0] };
        merged.qty = group.reduce((s, t) => s + t.qty, 0);
        merged.totalProceeds = group.reduce((s, t) => s + (t.totalProceeds || 0), 0);
        // Weighted average prices
        if (merged.qty > 0) {
          merged.proceedsPerShare = merged.totalProceeds / merged.qty;
        }
        result.push(merged);
      }
    }

    if (aggregatedCount > 0) {
      issues.push({
        severity: this.SEVERITY.AUTO_FIXED,
        message: `${aggregatedCount} transaction(s) had multiple lots (different grant numbers) -- aggregated by date and type.`
      });
    }

    return result;
  },

  // ---- Validation ----

  _validate(transactions, issues) {
    let priceWarnings = 0;
    let dateWarnings = 0;
    let negativeQty = 0;
    let crossFieldWarnings = 0;
    let missingVestPrices = 0;

    for (const t of transactions) {
      // Quantity validation
      if ((t.qty || 0) <= 0) {
        negativeQty++;
        t._hasError = true;
      }

      // Date validation
      const d = t.date ? new Date(t.date) : null;
      if (!d || isNaN(d.getTime())) {
        dateWarnings++;
        t._hasError = true;
      } else if (d.getFullYear() < 2018 || d.getFullYear() > 2030) {
        dateWarnings++;
        t._hasWarning = true;
      }

      // Price validation
      if (t.type === 'acquisition') {
        const priceUsd = (t.usdPricePerShare || 0) / 100;
        if (priceUsd > 0 && (priceUsd < 1 || priceUsd > 2000)) {
          priceWarnings++;
          t._hasWarning = true;
        }
        if (priceUsd === 0) {
          missingVestPrices++;
          t._hasWarning = true;
        }
      }

      if (t.type === 'disposal') {
        const salePrice = t._salePrice || ((t.gbpProceeds || 0) / 100 / (t.qty || 1));
        if (salePrice > 0 && (salePrice < 1 || salePrice > 2000)) {
          priceWarnings++;
          t._hasWarning = true;
        }

        // Cross-field: STC sale date should be within 3 days of vest date
        if (t.subtype === 'STC' && t._vestDate && t.date) {
          const vestD = new Date(t._vestDate);
          const saleD = new Date(t.date);
          if (!isNaN(vestD.getTime()) && !isNaN(saleD.getTime())) {
            const dayDiff = Math.abs((saleD - vestD) / 86400000);
            if (dayDiff > 3) {
              crossFieldWarnings++;
              t._hasWarning = true;
            }
          }
        }

        // Cross-field: sale price vs vest price for STC
        if (t.subtype === 'STC' && t._vestPrice && t._salePrice) {
          const ratio = t._salePrice / t._vestPrice;
          if (ratio < 0.5 || ratio > 1.5) {
            crossFieldWarnings++;
            t._hasWarning = true;
          }
        }

        // Cross-field: total proceeds vs qty * price
        if (t._salePrice && t.qty && t.gbpProceeds) {
          const expected = t.qty * t._salePrice * 100;
          const actual = t.gbpProceeds;
          if (expected > 0 && Math.abs(actual - expected) / expected > 0.05) {
            crossFieldWarnings++;
            t._hasWarning = true;
          }
        }
      }
    }

    if (negativeQty > 0) {
      issues.push({ severity: this.SEVERITY.ERROR, message: `${negativeQty} transaction(s) have zero or negative quantities.` });
    }
    if (dateWarnings > 0) {
      issues.push({ severity: this.SEVERITY.WARNING, message: `${dateWarnings} transaction(s) have invalid or out-of-range dates (expected 2018-2030).` });
    }
    if (priceWarnings > 0) {
      issues.push({ severity: this.SEVERITY.WARNING, message: `${priceWarnings} price(s) are outside the expected range ($1-$2,000). Please verify.` });
    }
    if (crossFieldWarnings > 0) {
      issues.push({ severity: this.SEVERITY.WARNING, message: `${crossFieldWarnings} cross-field check(s) flagged: STC date/price mismatches or proceeds discrepancies.` });
    }
    if (missingVestPrices > 0) {
      issues.push({ severity: this.SEVERITY.WARNING, message: `${missingVestPrices} vesting event(s) have $0 vest price. Acquisition cost cannot be computed without this.` });
    }
  },

  // ---- Duplicate detection ----

  _detectDuplicates(transactions, issues) {
    let dupeCount = 0;
    for (const t of transactions) {
      if (t.type === 'unknown') continue;
      const isDupe = TRANSACTIONS.some(existing => {
        if (existing.date !== t.date) return false;
        if (existing.type !== t.type) return false;
        if (existing.qty !== t.qty) return false;
        // For acquisitions, check price match
        if (t.type === 'acquisition' && existing.usdPricePerShare &&
            Math.abs(existing.usdPricePerShare - (t.usdPricePerShare || 0)) < 10) return true;
        // For disposals, check proceeds match
        if (t.type === 'disposal' && existing.gbpProceeds &&
            Math.abs(existing.gbpProceeds - (t.gbpProceeds || 0)) < 1000) return true;
        // Same date, type, qty is enough for a likely match
        return true;
      });
      if (isDupe) {
        t._duplicate = true;
        dupeCount++;
      }
    }
    if (dupeCount > 0) {
      issues.push({
        severity: this.SEVERITY.WARNING,
        message: `${dupeCount} transaction(s) appear to already exist in the pool and will be skipped.`
      });
    }
  },

  // ---- Date cutoff: exclude transactions already covered by pool data ----

  _getLatestExistingDate() {
    let latest = null;
    for (const t of TRANSACTIONS) {
      if (t.date && (!latest || t.date > latest)) {
        latest = t.date;
      }
    }
    return latest;
  },

  _applyDateCutoff(transactions, issues) {
    const cutoffDate = this._getLatestExistingDate();
    if (!cutoffDate) return null;

    let coveredCount = 0;
    for (const t of transactions) {
      if (t._duplicate) continue; // already marked as duplicate
      if (t.date && t.date <= cutoffDate) {
        t._coveredByPool = true;
        coveredCount++;
      }
    }

    if (coveredCount > 0) {
      issues.push({
        severity: this.SEVERITY.WARNING,
        message: `${coveredCount} transaction(s) on or before ${cutoffDate} excluded -- already covered by existing pool data. Only transactions after this date will be imported.`
      });
    }

    return cutoffDate;
  },

  // ---- Helpers ----

  _isPriceColumn(header) {
    const h = header.toLowerCase();
    return h.includes('price') || h.includes('fmv') || h.includes('cost') ||
           h.includes('proceeds') || h.includes('value') || h.includes('amount') ||
           h.includes('basis');
  },

  _recoverFromExcelDate(dateObj) {
    // Excel stores numbers as serial dates relative to 1899-12-30
    // If a value like 171.16 was interpreted as a date, we recover it
    // by computing the serial date number
    const epoch = new Date(1899, 11, 30); // Dec 30, 1899
    const serialDays = (dateObj.getTime() - epoch.getTime()) / 86400000;
    // The recovered number should be a reasonable dollar value (1-2000)
    if (serialDays >= 1 && serialDays <= 200000) {
      // Check if this could be a dollar amount with cents
      // Serial dates for dollar values $1-$2000 would be days 1-2000
      // which maps to dates in 1900-1905
      if (dateObj.getFullYear() <= 1910) {
        // This is almost certainly a corrupted dollar value
        // The serial number IS the dollar value
        return Math.round(serialDays * 100) / 100;
      }
    }
    return null;
  },

  _parseNumber(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    if (val instanceof Date) {
      const recovered = this._recoverFromExcelDate(val);
      return recovered !== null ? recovered : 0;
    }
    const s = String(val).trim();
    // Detect Excel date-corrupted values: "1900-MM-DD HH:MM:SS" pattern
    // These are dollar values that Excel misinterpreted as dates
    if (/^190[0-5]-\d{2}-\d{2}/.test(s)) {
      const d = new Date(s.replace(' ', 'T'));
      if (!isNaN(d.getTime())) {
        const recovered = this._recoverFromExcelDate(d);
        if (recovered !== null) return recovered;
      }
    }
    const cleaned = s.replace(/[$,\s]/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
  },

  _normalizeDate(val) {
    if (!val) return null;
    // Helper: format year/month/day as YYYY-MM-DD without timezone issues
    const ymd = (y, m, d) => {
      if (y < 2000 || y > 2030) return null;
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    };
    if (val instanceof Date) {
      if (val.getFullYear() < 2000) return null; // corrupted date
      // Use local date parts to avoid timezone shift
      return ymd(val.getFullYear(), val.getMonth() + 1, val.getDate());
    }
    const s = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // MM/DD/YYYY
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
      const parts = s.split('/');
      return ymd(parseInt(parts[2]), parseInt(parts[0]), parseInt(parts[1]));
    }
    // MM/DD/YY
    if (/^\d{1,2}\/\d{1,2}\/\d{2}$/.test(s)) {
      const parts = s.split('/');
      return ymd(parseInt(parts[2]) + 2000, parseInt(parts[0]), parseInt(parts[1]));
    }
    // DD-MMM-YYYY (e.g. "26-APR-2021")
    if (/^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(s)) {
      const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
      const parts = s.split('-');
      const mon = months[parts[1].toLowerCase()];
      if (mon) return ymd(parseInt(parts[2]), mon, parseInt(parts[0]));
    }
    // Try native parse as last resort
    const d = new Date(s);
    if (!isNaN(d.getTime()) && d.getFullYear() >= 2000 && d.getFullYear() <= 2030) {
      return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
    return null;
  },

  // ---- Validation report HTML ----

  renderReport(result) {
    const severityIcon = (s) => {
      if (s === this.SEVERITY.AUTO_FIXED) return '<span class="issue-icon">&#10003;</span>';
      if (s === this.SEVERITY.WARNING) return '<span class="issue-icon">&#9888;</span>';
      return '<span class="issue-icon">&#10007;</span>';
    };

    const issuesHtml = result.issues.length > 0
      ? result.issues.map(i => `
          <div class="import-issue ${i.severity}">
            ${severityIcon(i.severity)}
            <span class="issue-text">${i.message}</span>
          </div>`).join('')
      : '<div class="import-issue auto-fixed"><span class="issue-icon">&#10003;</span><span class="issue-text">No issues found -- all data looks clean.</span></div>';

    const validTx = result.transactions.filter(t => t.type !== 'unknown' && !t._hasError);
    const newTx = validTx.filter(t => !t._duplicate && !t._coveredByPool);
    const skipTx = validTx.filter(t => t._duplicate || t._coveredByPool);
    const coveredTx = validTx.filter(t => t._coveredByPool && !t._duplicate);

    // Cutoff date banner
    let cutoffHtml = '';
    if (result.cutoffDate) {
      cutoffHtml = `
        <div style="background:var(--primary-light);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:var(--fs-sm);">
          <strong>Importing transactions after ${result.cutoffDate}</strong> (existing pool data covers earlier periods).
          ${coveredTx.length > 0 ? `<br>${coveredTx.length} transaction(s) excluded as already covered.` : ''}
        </div>`;
    }

    // Transaction table
    let tableHtml = '';
    if (validTx.length > 0) {
      tableHtml = `
        <div class="table-scroll" style="max-height:300px;overflow-y:auto;">
          <table class="data-table">
            <thead><tr>
              <th>Date</th><th>Type</th><th>Qty</th><th>Price (USD)</th><th>Status</th>
            </tr></thead>
            <tbody>${validTx.map(t => {
              const price = t.type === 'acquisition'
                ? (t.usdPricePerShare / 100).toFixed(2)
                : (t._salePrice || ((t.gbpProceeds || 0) / 100 / (t.qty || 1))).toFixed(2);
              const isSkipped = t._duplicate || t._coveredByPool;
              const status = t._duplicate ? '<span style="color:var(--text-muted)">Already in pool</span>'
                : t._coveredByPool ? '<span style="color:var(--text-muted)">Covered by existing data</span>'
                : t._hasWarning ? '<span style="color:var(--warning)">Verify</span>'
                : '<span style="color:var(--success)">Ready</span>';
              return `<tr${isSkipped ? ' style="opacity:0.5"' : ''}>
                <td>${t.date || 'N/A'}</td>
                <td>${t.classification || t.subtype || t.type}</td>
                <td>${fmtNum(t.qty)}</td>
                <td>$${price}</td>
                <td>${status}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>
        </div>`;
    }

    // Unknown transactions
    const unknowns = result.transactions.filter(t => t.type === 'unknown');
    let unknownHtml = '';
    if (unknowns.length > 0) {
      unknownHtml = `
        <div style="margin-top:12px;">
          <p style="font-size:var(--fs-sm);color:var(--warning);font-weight:600;">${unknowns.length} row(s) could not be classified and will be skipped.</p>
        </div>`;
    }

    return `
      <div class="import-report">
        <div class="import-report-header">
          <h3>Data Import Review</h3>
        </div>
        <div class="import-report-meta">
          <span class="label">File</span><span class="value">${result.file.name} (${(result.file.size/1024).toFixed(1)} KB)</span>
          <span class="label">Detected format</span><span class="value">${result.schemaLabel}</span>
          <span class="label">Rows parsed</span><span class="value">${result.transactions.length}</span>
          <span class="label">Issues found</span><span class="value">${result.issues.length}</span>
        </div>

        ${cutoffHtml}

        <h4 style="margin-bottom:8px;">Issues</h4>
        ${issuesHtml}

        <div class="import-summary-bar">
          <div class="stat new">New to import: ${newTx.length}</div>
          <div class="stat skip">Skipped (existing/covered): ${skipTx.length}</div>
          ${result.hasErrors ? '<div class="stat error">Errors must be resolved before import</div>' : ''}
        </div>

        ${tableHtml}
        ${unknownHtml}

        <div class="import-actions">
          ${!result.hasErrors && newTx.length > 0
            ? '<button class="btn btn-accent" onclick="App.confirmFileImport()">Confirm Import</button>'
            : '<button class="btn btn-accent" disabled style="opacity:0.5;cursor:not-allowed;">Cannot Import</button>'}
          <button class="btn btn-outline" onclick="document.getElementById(\'csvPreview\').innerHTML=\'\'">Cancel</button>
        </div>
      </div>`;
  },
};

    const section = document.getElementById('other-income-section');

      section.style.display = showing ? 'none' : 'block';

    if (this.currentScreen === 1) {

          </div>
          ${hasP60 ? `<a class="doc-card-edit" onclick="App.editP60()">Edit</a>` : ''}
        </div>
        <div class="doc-card-body">
          ${hasP60 ? `
            <div class="form-row">
              <div class="form-group">
                <label>Gross pay</label>
                <input type="text" value="${fmt(empData.grossPay)}" readonly style="background:var(--surface);">
              </div>
              <div class="form-group">
                <label>Tax paid (PAYE)</label>
                <input type="text" value="${fmt(empData.taxPaid)}" readonly style="background:var(--surface);">

            <div class="form-row">
              <div class="form-group">
                <label>Gross pay</label>
                <input type="number" id="p60Gross" placeholder="e.g. 250000" step="0.01">
              </div>
              <div class="form-group">
                <label>Tax paid (PAYE)</label>

          `}

      </div>`;

    if (this.selectedSources.equity) {

        <div class="doc-card-header">
          <div class="doc-card-title">
            <span class="status-dot ${hasEquity ? 'complete' : 'missing'}"></span>

            ${hasEquity ? '<span class="doc-card-pill pill pill-green">Uploaded</span>' : '<span class="doc-card-pill pill pill-grey">Not yet uploaded</span>'}

        </div>
        <div class="doc-card-body">
          ${hasEquity ? `<p>${yearTx.length} disposal(s) loaded for ${yr}</p>` :
            `<p>No share transactions for ${yr}. Use the drop zone above to import your data.</p>
            <div class="guidance">Where to find this: E*TRADE > Tax Center > Gains & Losses (Expanded) report</div>`}

        <div class="doc-card-header">
          <div class="doc-card-title">
            <span class="status-dot ${hasPen ? 'complete' : 'missing'}"></span>
            Pension
            ${hasPen ? '<span class="doc-card-pill pill pill-green">Uploaded</span>' : '<span class="doc-card-pill pill pill-grey">Not yet uploaded</span>'}
          </div>
          ${hasPen ? `<a class="doc-card-edit" onclick="App.editPension()">Edit</a>` : ''}
        </div>
        <div class="doc-card-body">
          ${hasPen ? `
            <p>${penData.schemeType === 'salary-sacrifice' ? 'Salary Sacrifice' : 'Relief at Source'} |
            Employee: ${fmt(penData.employeeContrib)} | Employer: ${fmt(penData.employerContrib)}
            ${penData.sippContrib ? ' | SIPP: ' + fmt(penData.sippContrib) : ''}</p>
          ` : `<p>No pension data for this year.</p>`}
        </div>
      </div>`;
    }

    if (this.selectedSources.rental) {
      const renData = RENTAL_DATA[yr];
      const hasRen = !!renData;
      docCards += `<div class="doc-card ${hasRen ? 'completed' : ''}">
        <div class="doc-card-header">
          <div class="doc-card-title">
            <span class="status-dot ${hasRen ? 'complete' : 'missing'}"></span>
            Rental Income
            ${hasRen ? '<span class="doc-card-pill pill pill-green">Uploaded</span>' : '<span class="doc-card-pill pill pill-grey">Not yet uploaded</span>'}
          </div>
          ${hasRen ? `<a class="doc-card-edit" onclick="App.editRental()">Edit</a>` : ''}
        </div>
        <div class="doc-card-body">
          ${hasRen ? `<p>Gross rent: ${fmt(renData.grossRent)}</p>` : `<p>No rental data for this year.</p>`}

    return `<div class="screen">
      ${this.renderStepDots(3)}
      <h2>Your documents</h2>
      <div class="drop-zone" id="dropZone" style="padding:48px 24px;min-height:180px;"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="event.preventDefault();this.classList.remove('dragover');App.handleDrop(event)"
           onclick="document.getElementById('csvFile').click()">
        <div class="drop-zone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-zone-title">Drop files here or click to browse</div>
        <div class="drop-zone-sub">Start by uploading your E*TRADE Gains & Losses export, P60, or payslips.</div>
        <div class="drop-zone-formats">.xlsx, .xls, .csv, .txt</div>
        <input type="file" accept=".xlsx,.xls,.csv,.txt" id="csvFile" onchange="App.handleCSVUpload(event)" multiple>
      </div>
      <div id="csvPreview"></div>
      <div class="doc-cards">${docCards}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="App.goTo(2)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <button class="btn btn-primary" onclick="App.goTo(4)">
          Continue
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>`;
  },

  saveP60() {
    const gross = parseFloat(document.getElementById('p60Gross')?.value);
    const tax = parseFloat(document.getElementById('p60Tax')?.value);
    if (!gross || !tax) return;
    EMPLOYMENT_DATA[this.currentYear] = { grossPay: p(gross), taxPaid: p(tax) };
    this.renderScreen();
  },

  editP60() {
    const yr = this.currentYear;
    const emp = EMPLOYMENT_DATA[yr];
    if (!emp) return;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `<div class="modal">
      <div class="modal-header"><h3>Edit P60 -- ${yr}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="form-row">
        <div class="form-group"><label>Gross pay</label><input type="number" id="editP60Gross" value="${toPounds(emp.grossPay)}" step="0.01"></div>
        <div class="form-group"><label>Tax paid (PAYE)</label><input type="number" id="editP60Tax" value="${toPounds(emp.taxPaid)}" step="0.01"></div>
      </div>
      <button class="btn btn-primary" onclick="App.saveEditP60()">Save</button>
    </div>`;
    document.body.appendChild(overlay);
  },

  saveEditP60() {
    const gross = parseFloat(document.getElementById('editP60Gross')?.value);
    const tax = parseFloat(document.getElementById('editP60Tax')?.value);
    if (!gross || !tax) return;
    EMPLOYMENT_DATA[this.currentYear] = { grossPay: p(gross), taxPaid: p(tax) };
    document.querySelector('.modal-overlay')?.remove();
    this.renderScreen();
  },

  editPension() {
    alert('Edit pension data via Settings > Import Data (JSON)');
  },

  editRental() {
    alert('Edit rental data via Settings > Import Data (JSON)');
  },

  // ========== SCREEN 4: SUMMARY ==========

  renderSummary() {
    const yr = this.currentYear;
    const isProvisional = yr === '2025/26';
    const sa = SelfAssessment.compute(yr);

    if (!sa) {
      return `<div class="screen">
        ${this.renderStepDots(4)}
        <h2>Your tax summary</h2>
        <div class="card" style="padding:32px;text-align:center;">
          <p style="font-size:15px;color:var(--text-secondary);margin-bottom:16px;">No data yet for ${yr}.</p>
          <p style="font-size:13px;color:var(--text-tertiary);">Go back to upload your documents -- we need at least your P60 and share transaction data to calculate your liability.</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="App.goTo(3)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
        </div>
      </div>`;
    }

    const { incomeTax: it, cgt, rental, pension, totalLiability, poaRequired, poaAmount, poolResult, auditTrail, invariantErrors, computationMode } = sa;
    const deadlineYear = parseInt(yr.split('/')[0]) + 2;
    const isLocked = CalibrationConfig.lockedYears.includes(yr);
    const trustLevel = CalibrationConfig.getTrustLevel(yr);

    // Readiness check
    const empData = EMPLOYMENT_DATA[yr];
    const renData = RENTAL_DATA[yr];
    const penData = PENSION_DATA[yr];
    const yearTx = poolResult.disposals.filter(d => d.taxYear === yr);
    const items = [
      { label: 'P60', done: !!empData },
      { label: 'Share data', done: yearTx.length > 0 },
      { label: 'HMRC rate', done: !isProvisional },
      { label: 'Pension', done: !!penData },
    ];
    if (this.selectedSources.rental) {
      items.push({ label: 'Rental', done: !!renData });
    }
    const doneCount = items.filter(i => i.done).length;
    const isComplete = doneCount === items.length;

    // Assumption count
    const assumptionCount = auditTrail ? auditTrail.length : 0;

    // Plain English explainer
    const parts = [];
    if (it.netUnderpayment > 0) parts.push('income tax');
    if (cgt.cgtDue > 0) parts.push('capital gains tax on your share sales');
    const explainerText = parts.length > 0
      ? `This is made up of ${parts.join(' and ')}. Here's the breakdown.`
      : `Here's the breakdown of your position for ${yr}.`;

    // Pension
    let pensionBadge, pensionAmount, pensionDetail;
    if (pension) {
      if (pension.excess > 0) {
        pensionBadge = '<span class="br-badge due">Excess</span>';
        pensionAmount = fmt(pension.excess);
        pensionDetail = 'You have exceeded your annual allowance.';
      } else {
        pensionBadge = '<span class="br-badge ok">All good</span>';
        pensionAmount = '<span class="br-amount muted">No charge</span>';
        const maxSipp = PensionCalc.maxSIPP(yr);
        pensionDetail = `You're within your annual allowance. You can contribute up to ${fmt(maxSipp)} more to your SIPP this year.`;
      }
    } else {
      pensionBadge = '<span class="br-badge included">N/A</span>';
      pensionAmount = '<span class="br-amount muted">--</span>';
      pensionDetail = 'No pension data for this year.';
    }

    // Rental
    let rentalBadge, rentalAmount, rentalDetail;
    if (rental.inactive) {
      rentalBadge = '<span class="br-badge included">N/A</span>';
      rentalAmount = '<span class="br-amount muted">N/A</span>';
      rentalDetail = 'No rental data for this year.';
    } else {
      rentalBadge = '<span class="br-badge included">Included above</span>';
      rentalAmount = `<span class="br-amount muted">${fmt(rental.taxableProfit)} profit</span>`;
      rentalDetail = 'Rental tax is part of your income tax figure. Mortgage interest credit applied.';
    }

    // Provisional banner
    let banner = '';
    if (isProvisional) {
      banner = `<div class="provisional-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div><strong>2025/26 figures are estimated</strong> -- HMRC official USD/GBP exchange rate not yet published. Update via Settings once available.</div>
      </div>`;
    }

    // Verification/estimated pill
    const statusPill = isLocked
      ? '<span class="pill pill-green">Verified against filed return</span>'
      : '<span class="pill pill-amber">Estimated</span>';

    return `<div class="screen">
      ${this.renderStepDots(4)}

      ${banner}

      <!-- Readiness -->
      <div class="readiness no-print">
        <div class="readiness-left">
          <div class="readiness-dots">
            ${items.map(i => `<div class="r-dot ${i.done ? '' : 'pending'}"></div>`).join('')}
          </div>
          <span class="readiness-label">${isComplete ? 'All documents received' : `${doneCount} of ${items.length} items ready`}</span>
        </div>
        <span class="pill ${isComplete ? 'pill-green' : 'pill-amber'}">${isComplete ? 'Ready to file' : 'Pending'}</span>
      </div>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-intro">Here's what you owe for ${yr}</div>
        <div class="hero-amount">${fmt(totalLiability)}</div>
        <div class="hero-meta">
          <span class="hero-due">Due 31 January ${deadlineYear}${poaRequired ? ` | POA: 2 x ${fmt(poaAmount)}` : ''}</span>
          ${statusPill}
        </div>
      </div>

      <!-- Explainer -->
      <div class="explainer">${explainerText}</div>

      <div class="divider"></div>

      <!-- Breakdown -->
      <div class="section-label">Breakdown</div>
      <div class="breakdown">
        <div class="breakdown-card">
          <div class="br-top">
            <div class="br-name">Income tax</div>
            <span class="br-badge ${it.netUnderpayment >= 0 ? 'due' : 'ok'}">${it.netUnderpayment >= 0 ? 'Amount due' : 'Overpaid'}</span>
          </div>
          <div class="br-amount">${fmt(Math.abs(it.netUnderpayment))}</div>
          <div class="br-detail">Your employer didn't collect enough through PAYE. <a href="#" onclick="event.preventDefault();App.showComputation('income')">View computation</a></div>
        </div>
        <div class="breakdown-card">
          <div class="br-top">
            <div class="br-name">Capital gains tax</div>
            <span class="br-badge disposals">${cgt.disposals.length} share sale${cgt.disposals.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="br-amount">${fmt(cgt.cgtDue)}</div>
          <div class="br-detail">Tax on gains from selling shares. <a href="#" onclick="event.preventDefault();App.showComputation('cgt')">View computation</a></div>
        </div>
        <div class="breakdown-card">
          <div class="br-top">
            <div class="br-name">Pension</div>
            ${pensionBadge}
          </div>
          ${typeof pensionAmount === 'string' && pensionAmount.startsWith('<') ? pensionAmount : `<div class="br-amount">${pensionAmount}</div>`}
          <div class="br-detail">${pensionDetail}${pension ? ` <a href="#" onclick="event.preventDefault();App.showComputation('pension')">View computation</a>` : ''}</div>
        </div>
        <div class="breakdown-card">
          <div class="br-top">
            <div class="br-name">Rental income</div>
            ${rentalBadge}
          </div>
          ${typeof rentalAmount === 'string' && rentalAmount.startsWith('<') ? rentalAmount : `<div class="br-amount">${rentalAmount}</div>`}
          <div class="br-detail">${rentalDetail}${!rental.inactive ? ` <a href="#" onclick="event.preventDefault();App.showComputation('rental')">View computation</a>` : ''}</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Timeline -->
      <div class="section-label">Your timeline</div>
      ${this.renderTimeline(yr, deadlineYear)}

      <a class="cal-link no-print" onclick="App.downloadICS()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Add key dates to calendar
      </a>

      <!-- Actions -->
      <div class="actions no-print">
        <button class="btn btn-primary" onclick="window.print()">Print computation</button>
        <button class="btn btn-secondary" onclick="App.exportData()">Download PDF</button>
        <button class="btn btn-secondary" onclick="window.open('https://www.gov.uk/pay-self-assessment-tax-bill','_blank')">How to pay HMRC</button>
      </div>

      <div class="btn-row no-print">
        <button class="btn btn-ghost" onclick="App.goTo(3)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <button class="btn btn-primary" onclick="App.goTo(1)">Go to Dashboard</button>
      </div>

      ${this.renderInvariantErrors(invariantErrors)}
      ${this.renderFxUnverifiedNote(auditTrail)}
      ${this.renderAuditTrail(auditTrail)}

      <!-- Footnote -->
      <div class="footnote">
        ${isLocked ? 'Verified against filed return' : 'Estimated'} &middot; ${assumptionCount} assumptions disclosed<br>
        <a href="#" onclick="event.preventDefault();document.querySelector('.audit-trail-toggle')?.click()">View computation assumptions</a>
      </div>

      ${this.renderPrintComputation(yr, sa)}
    </div>`;
  },
  // ========== TIMELINE ==========

  renderTimeline(yr, deadlineYear) {
    const startYear = parseInt(yr.split('/')[0]);
    const endYear = startYear + 1;
    const now = new Date();

    const events = [
      { date: `${startYear}-05-15`, title: 'Share transaction data uploaded', sub: 'Quarterly E*TRADE exports for RSU vestings and sales' },
      { date: `${endYear}-04-05`, title: 'P60 received', sub: "Your employer's year-end summary of pay and tax deducted" },
      { date: `${endYear}-06-01`, title: 'HMRC exchange rate confirmed', sub: 'Official USD/GBP rate used to convert your share gains to pounds' },
      { date: `${deadlineYear}-01-31`, title: `File and pay by 31 January ${deadlineYear}`, sub: 'Submit your return and pay the amount above to HMRC' },
    ];

    return `<div class="timeline">
      ${events.map((e, idx) => {
        const eventDate = new Date(e.date);
        const isDone = eventDate < now;
        const isLast = idx === events.length - 1;
        return `<div class="tl-row">
          <div class="tl-marker">
            <div class="tl-dot ${isDone ? 'done' : 'pending'}"></div>
            ${!isLast ? `<div class="tl-stem ${isDone ? 'done' : ''}"></div>` : ''}
          </div>
          <div class="tl-content">
            <div class="tl-title">${e.title}</div>
            <div class="tl-sub">${e.sub}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  },

  // ========== INVARIANT ERRORS ==========

  renderInvariantErrors(errors) {
    if (!errors || errors.length === 0) return '';
    return errors.map(err => `
      <div class="invariant-error-card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>${err}</span>
      </div>
    `).join('');
  },

  // ========== FX UNVERIFIED NOTE ==========

  renderFxUnverifiedNote(auditTrail) {
    if (!auditTrail) return '';
    const fxItem = auditTrail.find(a => a.key === 'fx_rate' && a.verified === false);
    if (!fxItem) return '';
    return `<div class="fx-unverified-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>FX rate (${fxItem.value}) is unverified: ${fxItem.source}. Update via Settings once the official HMRC rate is published.</span>
    </div>`;
  },

  // ========== AUDIT TRAIL ==========

  renderAuditTrail(auditTrail) {
    if (!auditTrail || auditTrail.length === 0) return '';
    const items = auditTrail.map(a => {
      let noteHtml = '';
      if (a.note) {
        const isWarning = typeof a.note === 'string' && a.note.startsWith('WARNING');
        noteHtml = `<div class="audit-note ${isWarning ? 'warning' : ''}">${a.note}</div>`;
      }
      let sourceHtml = '';
      if (a.source) {
        sourceHtml = `<div class="audit-source">${a.source}</div>`;
      }
      let extraHtml = '';
      if (a.adjustment) {
        extraHtml = `<div class="audit-source">Adjustment: ${a.adjustment} -- ${a.reason || ''}</div>`;
      }
      return `<div class="audit-item">
        <span class="audit-key">${a.key}</span>
        <div>
          <span class="audit-value">${a.value}</span>
          ${sourceHtml}${noteHtml}${extraHtml}
        </div>
      </div>`;
    }).join('');

    return `<div class="audit-trail-card no-print">
      <div class="audit-trail-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open');">
        <h4>Computation assumptions</h4>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="audit-trail-body">
        ${items}
      </div>
    </div>`;
  },

  // ========== PRINT COMPUTATION ==========

  renderPrintComputation(yr, sa) {
    const { incomeTax: it, cgt, rental, pension, totalLiability, poaRequired, poaAmount } = sa;
    return `<div class="print-computation">
      <h2 style="margin-bottom:24px;">Self-Assessment Computation -- Tax Year ${yr}</h2>
      ${this.renderIncomeTaxComputation(it)}
      <div style="margin-top:32px;">${this.renderCGTComputation(sa)}</div>
      ${!rental.inactive ? `<div style="margin-top:32px;">${this.renderRentalComputation(rental)}</div>` : ''}
      ${pension ? `<div style="margin-top:32px;">${this.renderPensionComputation(yr, pension)}</div>` : ''}
      <div class="computation" style="margin-top:32px;">
        <div class="line total"><span class="label">Total self-assessment liability</span><span class="value">${fmt(totalLiability)}</span></div>
        ${poaRequired ? `<div class="line"><span class="label">Payments on account (2 x ${fmt(poaAmount)})</span><span class="value">${fmt(poaAmount * 2)}</span></div>` : ''}
      </div>
    </div>`;
  },

  // ========== COMPUTATION MODALS ==========

  showComputation(type) {
    const yr = this.currentYear;
    const sa = SelfAssessment.compute(yr);
    if (!sa) return;

    const titles = { income: 'Income Tax Computation', cgt: 'Capital Gains Tax', rental: 'Rental Income', pension: 'Pension Annual Allowance' };
    let content = '';

    switch (type) {
      case 'income': content = this.renderIncomeTaxComputation(sa.incomeTax); break;
      case 'cgt': content = this.renderCGTComputation(sa); break;
      case 'rental': content = this.renderRentalComputation(sa.rental); break;

  // ========== CSV / FILE IMPORT ==========

  handleDrop(event) {
    const files = event.dataTransfer?.files;
    if (files && files.length > 0) {
      for (let i = 0; i < files.length; i++) {
        this.loadFile(files[i]);
      }
    }
  },

  handleCSVUpload(event) {
    const files = event.target.files;
    if (files && files.length > 0) {
      for (let i = 0; i < files.length; i++) {
        this.loadFile(files[i]);
      }
    }
  },

  loadFile(file) {
    const ext = (file.name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || '';

    if (ext === 'xlsx' || ext === 'xls') {
      this._smartImport(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      this._csvText = e.target.result;
      this._currentFile = file;
      this._smartImport(file);
    };
    reader.readAsText(file);
  },

  async _smartImport(file) {
    const zone = document.getElementById('dropZone');
    const preview = document.getElementById('csvPreview');
    if (zone) {
      zone.innerHTML = `<div class="drop-zone-loaded" style="color:var(--text-secondary);">Parsing ${file.name}...</div>`;
    }

    try {
      const result = await FileImporter.parse(file);
      this._importResult = result;
      if (preview) {
        preview.innerHTML = `
          <div class="card" style="margin-top:16px;padding:20px;">
            ${FileImporter.renderReport(result)}
          </div>`;
      }
      if (zone) {
        zone.innerHTML = `
          <div class="drop-zone-loaded">Loaded: ${file.name} (${(file.size/1024).toFixed(1)} KB)</div>
          <input type="file" accept=".xlsx,.xls,.csv,.txt" id="csvFile" onchange="App.handleCSVUpload(event)" multiple>
          <div style="margin-top:8px;">
            <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();document.getElementById('csvFile').click()">Load another file</button>
          </div>`;
      }
    } catch (err) {
      if (preview) {
        preview.innerHTML = `<p style="color:var(--danger);margin-top:12px;">Error reading file: ${err.message}. If this is an .xlsx file, check that the SheetJS library loaded correctly.</p>`;
      }
      if (zone) {
        zone.innerHTML = `
          <div class="drop-zone-loaded" style="color:var(--danger);">Error: ${file.name}</div>
          <input type="file" accept=".xlsx,.xls,.csv,.txt" id="csvFile" onchange="App.handleCSVUpload(event)" multiple>`;
      }
    }
  },

  confirmFileImport() {
    const result = this._importResult;
    if (!result) return;

    const newTx = result.transactions.filter(t =>
      t.type !== 'unknown' && !t._hasError && !t._duplicate && !t._coveredByPool
    );

    let added = 0;
    for (const t of newTx) {
      const tx = { ...t };
      delete tx._raw; delete tx._duplicate; delete tx._coveredByPool;
      delete tx._hasError; delete tx._hasWarning; delete tx._vestDate;
      delete tx._vestPrice; delete tx._salePrice; delete tx.classification;
      TRANSACTIONS.push(tx);
      added++;
    }

    this._importResult = null;
    const preview = document.getElementById('csvPreview');
    if (preview) {
      preview.innerHTML = `<p style="color:var(--green);font-weight:600;margin-top:12px;">${added} transaction(s) imported successfully.</p>`;
    }
    setTimeout(() => this.renderScreen(), 1500);
  },

  // ========== CALENDAR .ICS ==========

  downloadICS() {
    const yr = this.currentYear;
    const startYear = parseInt(yr.split('/')[0]);
    const endYear = startYear + 1;
    const deadlineYear = startYear + 2;

    const events = [
      { date: `${startYear}0515`, summary: 'Q1 RSU Vesting', desc: 'Quarterly vesting date' },
      { date: `${startYear}0815`, summary: 'Q2 RSU Vesting', desc: 'Quarterly vesting date' },
      { date: `${startYear}1115`, summary: 'Q3 RSU Vesting', desc: 'Quarterly vesting date' },
      { date: `${endYear}0215`, summary: 'Q4 RSU Vesting', desc: 'Quarterly vesting date' },
      { date: `${endYear}0405`, summary: 'P60 Expected', desc: `Tax year ${yr} ends. P60 expected from employer.` },
      { date: `${endYear}0601`, summary: 'HMRC Rate Publication Expected', desc: 'Official USD/GBP exchange rate typically published May/June.' },
      { date: `${deadlineYear}0131`, summary: 'HMRC Filing Deadline', desc: `Self-assessment for ${yr} due to HMRC.` },
    ];

    const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    let ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//604//EN\r\nCALSCALE:GREGORIAN\r\n`;
    events.forEach((e, i) => {
      ics += `BEGIN:VEVENT\r\nDTSTART;VALUE=DATE:${e.date}\r\nSUMMARY:${e.summary}\r\nDESCRIPTION:${e.desc}\r\nUID:604-${yr}-${i}@local\r\nDTSTAMP:${now}\r\nEND:VEVENT\r\n`;
    });
    ics += `END:VCALENDAR\r\n`;

    const blob = new Blob([ics], { type: 'text/calendar' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tax-dates-${yr.replace('/', '-')}.ics`;
    a.click();
    URL.revokeObjectURL(a.href);
  },

  // ========== EXPORT / IMPORT ==========

  exportData() {
    // Generate run manifests for all years with data
    const manifests = {};
    for (const yr of ['2022/23', '2023/24', '2024/25', '2025/26']) {
      if (EMPLOYMENT_DATA[yr]) {
        manifests[yr] = CalibrationConfig.generateRunManifest(yr);
      }
    }
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      calibrationConfig: {
        mode: CalibrationConfig.mode,
        openingPool: CalibrationConfig.openingPool,
        fxProvenance: CalibrationConfig.fxProvenance,
        payeOverrides: CalibrationConfig.payeOverrides,
        pensionOverrides: CalibrationConfig.pensionOverrides,
        cgtRateAssumption: CalibrationConfig.cgtRateAssumption,
        lockedYears: CalibrationConfig.lockedYears,
        optionHoldVerified: CalibrationConfig.optionHoldVerified,
      },
      runManifests: manifests,
      hmrcRates: HMRC_RATES,
      transactions: TRANSACTIONS,
      rentalData: RENTAL_DATA,
      pensionData: PENSION_DATA,
      employmentData: EMPLOYMENT_DATA,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `604-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  },

  importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.version) throw new Error('Invalid export file (missing version).');
        let imported = [];
        if (data.hmrcRates) Object.assign(HMRC_RATES, data.hmrcRates);
        if (data.transactions && Array.isArray(data.transactions)) {
          TRANSACTIONS.length = 0;
          for (const t of data.transactions) TRANSACTIONS.push(t);
          imported.push(`${data.transactions.length} transactions`);
        }
        if (data.rentalData) { Object.assign(RENTAL_DATA, data.rentalData); imported.push('rental data'); }
        if (data.pensionData) { Object.assign(PENSION_DATA, data.pensionData); imported.push('pension data'); }
        if (data.employmentData) { Object.assign(EMPLOYMENT_DATA, data.employmentData); imported.push('employment data'); }
        alert('Imported: ' + imported.join(', ') + '. Refreshing...');
        this.renderScreen();
      } catch (err) {
        alert('Error importing data: ' + err.message);
      }
    };
    reader.readAsText(file);
  },

  // ========== TESTS ==========

  runTests() {
    const result = Tests.run();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    let html = '<div class="test-results">';
    for (const r of result.results) {
      if (r.section) { html += `<div class="test-section">${r.section}</div>`; continue; }
      const cls = r.passed ? 'test-pass' : 'test-fail';
      const icon = r.passed ? 'PASS' : 'FAIL';
      html += `<div class="${cls}">${icon}: ${r.label}`;
      if (!r.passed) html += ` (expected: ${r.expected}, got: ${r.actual})`;
      html += `</div>`;
    }
    html += `<div class="test-summary ${result.fail === 0 ? 'all-pass' : 'has-fail'}">`;
    html += `${result.pass}/${result.total} tests passed`;
    if (result.fail > 0) html += ` -- ${result.fail} FAILED`;
    html += `</div></div>`;

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Verification Results</h3>
          <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        ${html}
      </div>`;
    document.body.appendChild(overlay);
  },

  runEdgeCaseTests() {
    const result = EdgeCaseTests.run();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    let html = '<div class="test-results">';
    for (const r of result.results) {
      if (r.section) { html += `<div class="test-section">${r.section}</div>`; continue; }
      const cls = r.passed ? 'test-pass' : 'test-fail';
      const icon = r.passed ? 'PASS' : 'FAIL';
      html += `<div class="${cls}">${icon}: ${r.label}`;
      if (!r.passed) html += ` (expected: ${r.expected}, got: ${r.actual})`;
      html += `</div>`;
    }
    html += `<div class="test-summary ${result.fail === 0 ? 'all-pass' : 'has-fail'}">`;
    html += `${result.pass}/${result.total} tests passed`;
    if (result.fail > 0) html += ` -- ${result.fail} FAILED`;
    html += `</div></div>`;

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Edge Case Test Results</h3>
          <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        ${html}
      </div>`;
    document.body.appendChild(overlay);
  },
};

window.EdgeCaseTests = EdgeCaseTests;
window.FileImporter = FileImporter;

window.HMRC_RATES = HMRC_RATES;
window.EMPLOYMENT_DATA = EMPLOYMENT_DATA;

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
