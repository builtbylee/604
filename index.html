<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>604 — UK Self-Assessment Tax Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;450;500;550;600;700&display=swap" rel="stylesheet">
<style>
/* ========== DESIGN TOKENS ========== */
:root {
  --bg: #fafaf8;
  --bg-white: #ffffff;
  --text: #2d2d2d;
  --text-secondary: #7c7c78;
  --text-tertiary: #9c9c96;
  --text-muted: #b8b8b0;
  --border: #eaeae4;
  --border-hover: #ddddd6;
  --border-warm: #eeeee8;
  --surface: #f5f5f0;
  --accent: #4f6ef7;
  --accent-bg: #eff4ff;
  --green: #3a8a4a;
  --green-bg: #ecf7ee;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.008em;
}

/* ========== NAV ========== */
.nav {
  height: 56px;
  border-bottom: 1px solid var(--border-warm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  background: rgba(250,250,248,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}
.nav-brand {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
}
.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.nav-link {
  font-size: 13px;
  color: var(--text-tertiary);
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}
.nav-link:hover { color: var(--text); }

/* ========== LAYOUT ========== */
.container {
  max-width: 660px;
  margin: 0 auto;
  padding: 48px 24px 120px;
}

/* ========== SCREEN TRANSITIONS ========== */
.screen {
  animation: fadeIn 200ms ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== STEP INDICATOR ========== */
.steps {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin-bottom: 44px;
}
.step-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #d8d8d2;
  transition: all 0.2s;
}
.step-dot.done { background: var(--text); }
.step-dot.current { background: var(--accent); width: 9px; height: 9px; }
.step-line { width: 28px; height: 1px; background: #e5e5df; }
.step-line.done { background: var(--text); }

/* ========== TYPOGRAPHY ========== */
h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.2;
}
h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}
h3 {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}
h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 8px;
  line-height: 1.5;
  font-weight: 450;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 11px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  border: none;
  transition: all 0.15s ease;
  text-decoration: none;
}
.btn-primary {
  background: var(--text);
  color: #fff;
}
.btn-primary:hover { background: #444; }
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-ghost {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: 11px 16px;
}
.btn-ghost:hover {
  color: var(--text);
}
.btn-secondary {
  background: var(--bg-white);
  color: var(--text);
  border: 1px solid #e5e5df;
}
.btn-secondary:hover {
  background: var(--surface);
  border-color: #d8d8d2;
}
.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
}
.btn-accent {
  background: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: #3d5ce0; }
.btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 36px;
}

/* ========== CARDS ========== */
.card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

/* ========== DIVIDER ========== */
.divider { height: 1px; background: var(--border-warm); margin: 36px 0; }

/* ========== SECTION LABEL ========== */
.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-tertiary);
  letter-spacing: 0.03em;
  margin-bottom: 16px;
}

/* ========== PILLS / BADGES ========== */
.pill {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
.pill-green { background: var(--green-bg); color: var(--green); }
.pill-blue { background: var(--accent-bg); color: var(--accent); }
.pill-grey { background: var(--surface); color: var(--text-tertiary); }
.pill-amber { background: var(--amber-bg); color: #92400e; }

/* ========== TAX YEAR GRID (Screen 1) ========== */
.welcome-center {
  text-align: center;
  padding-top: 24px;
}
.year-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 32px auto;
  max-width: 480px;
}
.year-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  position: relative;
}
.year-card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.year-card.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.year-card.current-year {
  border-color: var(--accent);
}
.year-card .year-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.year-card .year-status {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.year-card .year-amount {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.year-card .year-pill {
  position: absolute;
  top: 12px;
  right: 12px;
}
.view-earlier {
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
  margin-top: 8px;
  text-decoration: none;
}
.view-earlier:hover {
  color: var(--accent);
}
.skip-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
.skip-link:hover { text-decoration: underline; }

/* ========== INCOME SOURCE CARDS (Screen 2) ========== */
.source-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.source-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.source-card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.source-card.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.source-card.disabled {
  opacity: 1;
  cursor: default;
}
.source-card .source-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  color: var(--text-secondary);
}
.source-card.selected .source-icon {
  background: var(--accent);
  color: #fff;
}
.source-card .source-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}
.source-card .source-desc {
  font-size: 12px;
  color: var(--text-secondary);
}
.source-card .source-na {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}
.pre-selected-note {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 16px;
}
.add-other-link {
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
  text-decoration: none;
  font-weight: 500;
}
.add-other-link:hover { text-decoration: underline; }

/* ========== DOCUMENTS (Screen 3) ========== */
.drop-zone {
  border: 2px dashed var(--border-hover);
  border-radius: 14px;
  padding: 40px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
  background: var(--bg-white);
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.drop-zone-icon {
  width: 44px;
  height: 44px;
  color: var(--text-muted);
}
.drop-zone-icon svg { width: 100%; height: 100%; }
.drop-zone-title {
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
}
.drop-zone-sub {
  font-size: 13px;
  color: var(--text-secondary);
  max-width: 340px;
}
.drop-zone-formats {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.drop-zone input[type="file"] { display: none; }
.drop-zone-loaded {
  font-weight: 600;
  color: var(--green);
  font-size: 13px;
}

.doc-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 24px;
}
.doc-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  transition: opacity 0.2s;
}
.doc-card.completed { opacity: 0.75; }
.doc-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.doc-card-title {
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.doc-card-title .status-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.doc-card-title .status-dot.complete { background: var(--green); }
.doc-card-title .status-dot.pending { background: var(--amber); }
.doc-card-title .status-dot.missing { background: var(--text-muted); }
.doc-card-pill { margin-left: 8px; }
.doc-card-edit {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}
.doc-card-edit:hover { text-decoration: underline; }
.doc-card-body {
  font-size: 13px;
  color: var(--text-secondary);
}
.doc-card .guidance {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ========== FORM FIELDS ========== */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}
.form-group input, .form-group select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  background: var(--bg-white);
  color: var(--text);
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,110,247,0.1);
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

/* ========== READINESS BAR ========== */
.readiness {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--surface);
  border-radius: 12px;
  margin-bottom: 44px;
}
.readiness-left { display: flex; align-items: center; gap: 12px; }
.readiness-dots { display: flex; gap: 5px; }
.r-dot { width: 7px; height: 7px; border-radius: 50%; background: #5dba6e; }
.r-dot.pending { background: #d8d8d2; }
.readiness-label { font-size: 13px; color: var(--text-secondary); font-weight: 450; }

/* ========== HERO AMOUNT ========== */
.hero {
  text-align: center;
  margin-bottom: 16px;
}
.hero-intro {
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 450;
  margin-bottom: 12px;
}
.hero-amount {
  font-size: 52px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hero-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.hero-due {
  font-size: 13px;
  color: var(--text-tertiary);
  font-weight: 400;
}

/* ========== EXPLAINER ========== */
.explainer {
  text-align: center;
  font-size: 13px;
  color: var(--text-tertiary);
  line-height: 1.6;
  margin-bottom: 8px;
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}

/* ========== BREAKDOWN CARDS ========== */
.breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.breakdown-card {
  padding: 20px;
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.breakdown-card:hover {
  border-color: var(--border-hover);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.br-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.br-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.br-badge {
  font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
  letter-spacing: 0.01em; white-space: nowrap;
}
.br-badge.due { background: var(--accent-bg); color: var(--accent); }
.br-badge.disposals { background: var(--accent-bg); color: var(--accent); }
.br-badge.ok { background: var(--green-bg); color: var(--green); }
.br-badge.included { background: var(--surface); color: var(--text-tertiary); }
.br-badge.estimated { background: var(--amber-bg); color: #92400e; }
.br-amount {
  font-size: 22px; font-weight: 600; color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.br-amount.muted { color: var(--text-muted); font-size: 14px; font-weight: 500; }
.br-detail { font-size: 12px; color: var(--text-tertiary); font-weight: 400; line-height: 1.5; }
.br-detail a { color: var(--accent); text-decoration: none; font-weight: 500; }
.br-detail a:hover { text-decoration: underline; }

/* ========== TIMELINE ========== */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 9px 0;
}
.tl-marker {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 4px;
}
.tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tl-dot.done { background: var(--text); }
.tl-dot.pending { border: 1.5px solid var(--text-muted); background: none; }
.tl-stem { width: 1px; height: 24px; background: #e5e5df; margin-top: 4px; }
.tl-stem.done { background: #d8d8d2; }
.tl-content { line-height: 1.45; }
.tl-title { font-size: 13px; color: var(--text); font-weight: 500; }
.tl-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }

/* ========== COMPUTATION DETAIL ========== */
.computation { font-size: 14px; }
.computation .section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 20px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.computation .section-title:first-child { margin-top: 0; }
.computation .line {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}
.computation .line .label { color: var(--text-secondary); }
.computation .line .value { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.computation .line.subtotal {
  border-top: 1px solid var(--border);
  margin-top: 4px;
  padding-top: 8px;
  font-weight: 600;
}
.computation .line.subtotal .label,
.computation .line.subtotal .value { color: var(--text); }
.computation .line.total {
  border-top: 2px solid var(--text);
  margin-top: 8px;
  padding-top: 8px;
  font-weight: 700;
  font-size: 14px;
}
.computation .line.total .label,
.computation .line.total .value { color: var(--text); }

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(45,45,45,0.3);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 200ms ease-out;
}
.modal {
  background: var(--bg-white);
  border-radius: 14px;
  padding: 32px;
  max-width: 700px;
  width: calc(100% - 48px);
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 25px 50px rgba(0,0,0,0.12);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.modal-close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border: none;
  background: var(--surface);
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
}
.modal-close:hover {
  background: var(--border);
  color: var(--text);
}

/* ========== DATA TABLE ========== */
.table-scroll { overflow-x: auto; }
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.data-table th {
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.data-table tr:last-child td { border-bottom: none; }
.positive { color: var(--green); }
.negative { color: var(--danger); }

/* ========== IMPORT REPORT ========== */
.import-report { font-size: 13px; }
.import-report-header { margin-bottom: 16px; }
.import-report-header h3 { font-size: 17px; }
.import-report-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 16px;
  margin-bottom: 16px;
  font-size: 12px;
}
.import-report-meta .label { font-weight: 600; color: var(--text-secondary); }
.import-report-meta .value { color: var(--text); }
.import-issue {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  margin-bottom: 4px;
  font-size: 12px;
}

<script>
/* ================================================================
   604 — UK SELF-ASSESSMENT TAX TOOL
   Single-file browser application -- no external dependencies
   All calculations in pence (integer arithmetic) internally
   ================================================================ */

// ========== CONSTANTS ==========
const HMRC_RATES = {
  '2022/23': 0.8202,
  '2023/24': 0.7981,
  '2024/25': 0.7836,
  '2025/26': 0.79, // PROVISIONAL
};

const AEA = {
  '2019/20': 1200000, '2020/21': 1230000, '2021/22': 1230000,
  '2022/23': 1230000, '2023/24': 600000,
  '2024/25': 300000, '2025/26': 300000,
};

// CGT rates: additional rate taxpayer on shares
// Pre-30 Oct 2024: 20%, on/after 30 Oct 2024: 24%
const CGT_RATE_PRE_BUDGET = 20;
const CGT_RATE_POST_BUDGET = 24;
const BUDGET_DATE = new Date(2024, 9, 30); // 30 Oct 2024

// Personal allowance
const PERSONAL_ALLOWANCE = 1257000; // £12,570 in pence
const PA_TAPER_THRESHOLD = 10000000; // £100,000

// Income tax bands (England/Wales) — in pence
const BASIC_RATE_LIMIT = 3770000; // £37,700
// Additional rate threshold varies by year
const ADDITIONAL_RATE_THRESHOLD = {
  '2019/20': 15000000, '2020/21': 15000000, '2021/22': 15000000,
  '2022/23': 15000000, // £150,000
  '2023/24': 12514000, '2024/25': 12514000, '2025/26': 12514000, // £125,140
};
const BASIC_RATE = 20;
const HIGHER_RATE = 40;
const ADDITIONAL_RATE = 45;

// Pension
const PENSION_AA = {
  '2019/20': 4000000, '2020/21': 4000000, '2021/22': 4000000,
  '2022/23': 4000000, '2023/24': 6000000,
  '2024/25': 6000000, '2025/26': 6000000,
};
const PENSION_TAPER_THRESHOLDS = {
  // [thresholdIncome, adjustedIncome, minAA]
  '2019/20': [11000000, 15000000, 1000000],
  '2020/21': [20000000, 24000000, 400000],
  '2021/22': [20000000, 24000000, 400000],
  '2022/23': [20000000, 24000000, 400000],
  '2023/24': [20000000, 26000000, 1000000],
  '2024/25': [20000000, 26000000, 1000000],
  '2025/26': [20000000, 26000000, 1000000],
};

// ========== UTILITY FUNCTIONS ==========
function p(pounds) {
  // Convert pounds to pence (integer)
  return Math.round(pounds * 100);
}

function toPounds(pence) {
  // Convert pence to pounds for display
  return pence / 100;
}

function fmt(pence) {
  // Format pence as £X,XXX.XX
  const pounds = pence / 100;
  return new Intl.NumberFormat('en-GB', {
    style: 'currency', currency: 'GBP',
    minimumFractionDigits: 2, maximumFractionDigits: 2
  }).format(pounds);
}

function fmtUSD(cents) {
  const dollars = cents / 100;
  return new Intl.NumberFormat('en-US', {
    style: 'currency', currency: 'USD',
    minimumFractionDigits: 2, maximumFractionDigits: 2
  }).format(dollars);
}

function fmtNum(n) {
  return new Intl.NumberFormat('en-GB').format(n);
}

function fmtPct(n) {
  return n.toFixed(1) + '%';
}

function taxYear(dateStr) {
  // Returns tax year string for a date, e.g. "2022/23"
  const d = new Date(dateStr);
  const y = d.getFullYear();
  const m = d.getMonth(); // 0-indexed
  const day = d.getDate();
  // Tax year starts 6 April
  if (m > 3 || (m === 3 && day >= 6)) {
    return y + '/' + String(y + 1).slice(2);
  } else {
    return (y - 1) + '/' + String(y).slice(2);
  }
}

function parseDate(dateStr) {
  // Parse YYYY-MM-DD to Date object
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysBetween(d1, d2) {
  const t1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate()).getTime();
  const t2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate()).getTime();
  return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
}

function roundPence(pence) {
  return Math.round(pence);
}

// ========== CALIBRATION CONFIG ==========
const CalibrationConfig = {
  mode: 'compatibility',

  openingPool: {
    date: null,
    qty: 0,
    sterlingCost: 0,
    usdConversionRate: 1.0,
    source: 'Not configured -- enter your opening pool position',
    locked: false,
  },

  fxProvenance: {
    '2022/23': { rate: 0.8202, label: 'published_hmrc_rate', source: 'HMRC annual average', verified: true, lastUpdated: '2023-06-01' },
    '2023/24': { rate: 0.7981, label: 'published_hmrc_rate', source: 'HMRC annual average', verified: true, lastUpdated: '2024-06-01' },
    '2024/25': { rate: 0.7836, label: 'published_hmrc_rate', source: 'HMRC annual average', verified: true, lastUpdated: '2025-06-01' },
    '2025/26': { rate: 0.79, label: 'manual_estimate', source: 'Provisional estimate -- update when HMRC publishes', verified: false, lastUpdated: '2026-03-15' },
  },

  payeOverrides: {},
  pensionOverrides: {},
  cgtRateAssumption: 'additional-rate-taxpayer',
  lockedYears: [],
  optionHoldVerified: false,

  getTrustLevel(year) {
    if (this.lockedYears.includes(year)) {
      const recon = this._getReconciliationDepth(year);
      if (recon.component_matched) return 'verified_filed';
      if (recon.summary_matched) return 'calibrated_historical';
      return 'calibrated_historical';
    }
    const fx = this.fxProvenance[year];
    if (!fx || !fx.verified) return 'provisional_blocked';
    if (EMPLOYMENT_DATA[year]?.taxPaid) return 'forward_estimate';
    return 'provisional_blocked';
  },

  getTrustDescription(year) {
    const level = this.getTrustLevel(year);
    return {
      verified_filed: 'These figures reproduce the filed return accepted by HMRC.',
      calibrated_historical: 'Calibrated against accountant workings. Not yet filed.',
      forward_estimate: 'Forward estimate using the same methodology as filed returns. Review before filing.',
      provisional_blocked: 'Provisional -- missing P60 or HMRC exchange rate. Not suitable for filing.',
    }[level] || 'Unknown';
  },

  forwardDisclaimer: 'Forward-year figures use the same methodology that reproduced previously filed returns. ' +
    'They are suitable for planning, but should be independently reviewed before filing if methodology ' +
    'or exchange-rate treatment changes.',

  getAuditTrail(year) {
    return this.generateRunManifest(year).assumptions_used;
  },

  generateRunManifest(year) {
    const isLocked = this.lockedYears.includes(year);
    const fx = this.fxProvenance[year];
    const paye = this.payeOverrides[year];
    const pen = this.pensionOverrides[year];
    const timestamp = new Date().toISOString();

    const trustLevel = this.getTrustLevel(year);
    const assumptions = [];

    assumptions.push({
      key: 'opening_pool_source',
      value: this.openingPool.qty > 0 ? 'user_configured' : 'not_configured',
      details: { shares: this.openingPool.qty, gbp_cost: this.openingPool.sterlingCost / 100, date: this.openingPool.date },
      source: this.openingPool.source,
      blind_computed: false,
      downstream_impact: { affects: ['pool_average_cost', 'cgt_all_years', 'carry_forward_chain'], years: 'all' },
    });

    assumptions.push({
      key: 'opening_pool_usd_conversion_mode',
      value: this.openingPool.usdConversionRate === 1.0 ? 'compatibility_rate_1_0' : `explicit_rate_${this.openingPool.usdConversionRate}`,
      note: 'GBP value used directly as USD pool cost in compatibility mode',
      blind_computed: false,
      downstream_impact: { affects: ['pool_average_cost', 'cgt_all_years'], years: 'all',
        change_effect: 'Changing this rate shifts the USD pool average, altering every disposal gain/loss and all CGT figures' },
    });

    if (fx) {
      assumptions.push({
        key: 'fx_source',
        value: fx.verified ? fx.label : 'manual_constant',
        details: { rate: fx.rate, verified: fx.verified, label: fx.label, last_updated: fx.lastUpdated },
        source: fx.source,
        warning: fx.verified ? null : 'Not sourced from HMRC published table -- verify before filing',
        blind_computed: false,
        downstream_impact: { affects: ['cgt_gbp_gains', 'cgt_due', 'total_liability'], years: [year],
          change_effect: 'Changing the FX rate changes all GBP gain/loss figures and CGT for this year only' },
      });
    }

    if (paye) {
      assumptions.push({
        key: 'tax_paid_override',
        value: true,
        details: { year, p60_figure: paye.p60Figure / 100, adjusted_figure: paye.adjustedFigure / 100, adjustment: paye.adjustment / 100, reason: paye.reason },
        source: paye.source,
        blind_computed: false,
        downstream_impact: { affects: ['income_tax_underpayment', 'total_liability'], years: [year],
          change_effect: 'Changing the PAYE adjustment directly changes the income tax underpayment by the same amount' },
      });
    } else {
      assumptions.push({
        key: 'tax_paid_override',
        value: false,
        note: 'P60 figure used as-is (no PAYE code adjustment)',
        blind_computed: true,
        downstream_impact: { affects: ['income_tax_underpayment'], years: [year] },
      });
    }

    if (pen) {
      assumptions.push({
        key: 'carry_forward_source',
        value: 'user_configured',
        details: { year, amount: pen.carryForward / 100 },
        source: pen.source,
        blind_computed: false,
        downstream_impact: { affects: ['pension_max_sipp', 'pension_allowance_check'], years: [year, '2025/26'],
          change_effect: 'Changing carry-forward alters the maximum additional SIPP contribution available' },
      });
    } else {
      assumptions.push({
        key: 'carry_forward_source',
        value: 'engine_computed',
        note: 'Carry-forward calculated dynamically from prior year data',
        blind_computed: true,
        downstream_impact: { affects: ['pension_max_sipp'], years: [year] },
      });
    }

    assumptions.push({
      key: 'cgt_rate_assumption',
      value: this.cgtRateAssumption,
      note: 'Assumes additional-rate taxpayer throughout. Basic/higher-rate band splitting not implemented.',
      blind_computed: false,
      downstream_impact: { affects: ['cgt_due', 'total_liability'], years: 'all',
        change_effect: 'A basic/higher-rate taxpayer would pay 10%/18% instead of 20%/24% on gains within their unused basic-rate band' },
    });

    assumptions.push({
      key: 'cgt_fx_method',
      value: 'annual_rate_compatibility',
      note: 'Pool tracked in USD; net gain/loss converted to GBP at annual HMRC rate. HMRC orthodox method is sterling-first with per-transaction date rates.',
      blind_computed: false,
      downstream_impact: { affects: ['cgt_gbp_gains', 'cgt_due', 'carry_forward_chain', 'total_liability'], years: 'all',
        change_effect: 'Switching to per-transaction sterling rates would change every disposal gain/loss. Annual-rate method was used in filed returns.' },
    });

    assumptions.push({
      key: 'year_status',
      value: isLocked ? 'locked_filed' : 'open_forward',
      note: isLocked ? 'Filed and accepted by HMRC -- compatibility assumptions apply' : 'Not yet filed -- forward-looking estimates',
      downstream_impact: { affects: ['all_outputs'], years: [year] },
    });

    assumptions.push({
      key: 'option_hold_verified',
      value: this.optionHoldVerified,
      note: this.optionHoldVerified ? 'Exercise-and-hold path verified against real data'
        : 'Exercise-and-hold path is modelled but NOT verified against real transaction data',
    });

    const warnings = [];
    if (fx && !fx.verified) {
      warnings.push(`FX rate ${fx.rate} for ${year} is not sourced from HMRC published table`);
    }
    if (year === '2025/26') {
      warnings.push('2025/26 is the current year -- all figures are provisional until P60 and HMRC rate are available');
    }
    if (warnings.length > 0) {
      assumptions.push({
        key: 'provisional_warnings',
        value: warnings,
      });
    }

    return {
      run_id: `${year.replace('/', '-')}-${this.mode}-${Date.now()}`,
      timestamp,
      tax_year: year,
      mode: this.mode,
      mode_description: this.mode === 'compatibility'
        ? 'Reproduces historically filed returns using verified legacy assumptions'
        : 'Forward-looking HMRC-defensible calculations using current methodology',
      run_trust_level: trustLevel,
      run_trust_description: this.getTrustDescription(year),
      reconciliation_depth: this._getReconciliationDepth(year),
      forward_disclaimer: isLocked ? null : this.forwardDisclaimer,
      assumptions_used: assumptions,
    };
  },

  _getReconciliationDepth(year) {
    if (!this.lockedYears.includes(year)) {
      return { level: 'none', note: 'Forward year -- not yet filed, no reconciliation possible' };
    }
    return {
      level: 'component_matched',
      summary_matched: true,
      component_matched: true,
      disposal_matched: false,
      details: {
        total_liability: 'Exact match (within £0.10)',
        income_tax_underpayment: 'Exact match',
        cgt_due: 'Exact match',
        gross_gains_losses: 'Within £2 (HMRC rate rounding)',
        rental_profit: 'Exact match',
        individual_disposals: 'Within ~£1 each but not penny-exact (FX rate precision)',
      },
      note: 'Return-level and major component figures match filed returns.',
    };
  }
};


// ========== ENGINE INVARIANTS ==========
const EngineInvariants = {
  errors: [],

  checkPoolNonNegative(poolQty, poolUsd, date, action) {
    if (poolQty < 0) {
      this.errors.push(`INVARIANT VIOLATION: Pool quantity went negative (${poolQty}) on ${date} during ${action}. This indicates missing acquisition data.`);
    }
  },

  checkMatchingOrder(matches) {
    const order = { 'same-day': 0, 'bed-and-breakfast': 1, 'section-104': 2 };
    let lastOrder = -1;
    for (const m of matches) {
      const o = order[m.rule] ?? 99;
      if (o < lastOrder) {
        this.errors.push(`INVARIANT VIOLATION: Matching order incorrect -- ${m.rule} appeared after a later-priority rule`);
      }
      lastOrder = o;
    }
  },

  checkBBNotInPool(bbMatchedAcqs, poolAcqs) {
  },

  checkBasisChain(disposal) {
    if (disposal.totalUsdCost === 0 && disposal.disposal.subtype !== 'voluntary') {
      this.errors.push(`WARNING: Disposal on ${disposal.disposal.date} has $0 cost basis. Verify acquisition data.`);
    }
  },

  reset() { this.errors = []; },

  getErrors() { return [...this.errors]; }
};


// ========== TRANSACTION DATA ==========
// No pre-loaded transactions -- user imports their own
const TRANSACTIONS = [];

// ========== RENTAL DATA ==========
// No pre-loaded rental data
const RENTAL_DATA = {};

// ========== PENSION DATA ==========
// No pre-loaded pension data
const PENSION_DATA = {};

// ========== EMPLOYMENT DATA ==========
// No pre-loaded employment data
const EMPLOYMENT_DATA = {};

// ========== SHARE POOL ENGINE ==========
const OPENING_BLENDED_RATE = CalibrationConfig.openingPool.usdConversionRate;

function usdToGbp(usdCents, year) {
  let rate = HMRC_RATES[year];
  if (rate > 1) rate = 1 / rate;
  return roundPence(usdCents * rate);
}

function acqUsdCost(acq) {
  if (acq.subtype === 'opening') {
    return Math.round(acq.gbpCost * OPENING_BLENDED_RATE);
  }
  return acq.qty * acq.usdPricePerShare;
}
const SharePool = {
  /**
   * Process all transactions and compute disposals with matching rules.
   * Pool tracks USD costs. GBP conversion at disposal using HMRC rate.
   * Returns { disposals, poolHistory, finalPool }
   */
  compute(transactions, hmrcRates) {
    EngineInvariants.reset();

    // Sort transactions by date, then acquisitions before disposals on same day
    const sorted = [...transactions].sort((a, b) => {
      const da = a.date.localeCompare(b.date);
      if (da !== 0) return da;
      if (a.type === 'acquisition' && b.type === 'disposal') return -1;
      if (a.type === 'disposal' && b.type === 'acquisition') return 1;
      return 0;
    });

    const acquisitions = sorted.filter(t => t.type === 'acquisition');
    const disposals = sorted.filter(t => t.type === 'disposal');

    // Track remaining qty per acquisition after matching
    const acqRemaining = acquisitions.map(a => ({
      ...a,
      remaining: a.qty,
      usdTotal: acqUsdCost(a), // total USD cost for this acquisition (cents)
    }));

    const results = [];

    // ---- MATCHING RULES (same as before) ----
    for (const disp of disposals) {
      let remainingToMatch = disp.qty;
      const dispDate = parseDate(disp.date);
      const matches = [];

      // Rule 1: Same-day acquisitions
      for (const acq of acqRemaining) {
        if (remainingToMatch <= 0) break;
        if (acq.remaining <= 0) continue;
        if (acq.date === disp.date) {
          const matchQty = Math.min(remainingToMatch, acq.remaining);
          const matchUsdCost = Math.round(acq.usdTotal * matchQty / acq.qty);
          matches.push({
            rule: 'same-day', qty: matchQty,
            usdCost: matchUsdCost, gbpCost: 0, // GBP filled at gain/loss calc
            acqDate: acq.date,
          });
          acq.remaining -= matchQty;
          remainingToMatch -= matchQty;
        }
      }

      // Rule 2: B&B (acquired within 30 days AFTER disposal)
      const bbCandidates = acqRemaining
        .filter(acq => {
          if (acq.remaining <= 0) return false;
          const acqDate = parseDate(acq.date);
          const days = daysBetween(dispDate, acqDate);
          return days > 0 && days <= 30;
        })
        .sort((a, b) => a.date.localeCompare(b.date));

      for (const acq of bbCandidates) {
        if (remainingToMatch <= 0) break;
        if (acq.remaining <= 0) continue;
        const matchQty = Math.min(remainingToMatch, acq.remaining);
        const matchUsdCost = Math.round(acq.usdTotal * matchQty / acq.qty);
        matches.push({
          rule: 'bed-and-breakfast', qty: matchQty,
          usdCost: matchUsdCost, gbpCost: 0,
          acqDate: acq.date,
        });
        acq.remaining -= matchQty;
        remainingToMatch -= matchQty;
      }

      // Rule 3: Section 104 pool
      if (remainingToMatch > 0) {
        matches.push({
          rule: 'section-104', qty: remainingToMatch,
          usdCost: 0, gbpCost: 0, // filled during pool processing
        });
      }

      // Invariant: verify matching order
      EngineInvariants.checkMatchingOrder(matches);

      results.push({ disposal: disp, matches, totalProceeds: disp.gbpProceeds });
    }

    // ---- BUILD USD POOL ----
    let poolQty = 0;
    let poolUsd = 0; // USD cents

    const poolHistory = [];
    const allEvents = [];

    // Acquisition events (only remaining shares after matching)
    for (const acq of acqRemaining) {
      if (acq.remaining > 0) {
        const usdForRemaining = Math.round(acq.usdTotal * acq.remaining / acq.qty);
        allEvents.push({
          date: acq.date, type: 'pool-add', qty: acq.remaining,
          usdCost: usdForRemaining, ref: acq
        });
      }
    }

    // Disposal events (section-104 matches)
    for (const r of results) {
      const s104Match = r.matches.find(m => m.rule === 'section-104');
      if (s104Match) {
        allEvents.push({
          date: r.disposal.date, type: 'pool-remove', qty: s104Match.qty,
          matchRef: s104Match, disposalRef: r
        });
      }
    }

    // Sort: date order, acquisitions before disposals on same day
    allEvents.sort((a, b) => {
      const da = a.date.localeCompare(b.date);
      if (da !== 0) return da;
      if (a.type === 'pool-add' && b.type === 'pool-remove') return -1;
      if (a.type === 'pool-remove' && b.type === 'pool-add') return 1;
      return 0;
    });

    // Process pool events in USD
    for (const evt of allEvents) {
      if (evt.type === 'pool-add') {
        poolQty += evt.qty;
        poolUsd += evt.usdCost;
        poolHistory.push({
          date: evt.date, action: 'Add to pool', qty: evt.qty,
          usdCost: evt.usdCost, poolQty, poolUsd,
          avgUsd: poolQty > 0 ? Math.round(poolUsd / poolQty) : 0,
          ref: evt.ref
        });
      } else {
        // Remove at current USD average
        const avgUsdPerShare = poolQty > 0 ? poolUsd / poolQty : 0;
        const removeUsd = Math.round(avgUsdPerShare * evt.qty);
        evt.matchRef.usdCost = removeUsd;
        poolQty -= evt.qty;
        poolUsd -= removeUsd;
        EngineInvariants.checkPoolNonNegative(poolQty, poolUsd, evt.date, 'pool-remove');
        poolHistory.push({
          date: evt.date, action: 'Remove from pool', qty: evt.qty,
          usdCost: removeUsd, poolQty, poolUsd,
          avgUsd: poolQty > 0 ? Math.round(poolUsd / poolQty) : 0,
          ref: evt.disposalRef
        });
      }
    }

    // ---- CALCULATE GBP GAIN/LOSS ----
    // The "gbpProceeds" in the transaction data are actually USD amounts
    // (copied from E*TRADE statements). The HMRC rate converts the NET
    // USD gain/loss to GBP for CGT purposes.
    for (const r of results) {
      r.taxYear = taxYear(r.disposal.date);
      let totalUsdCost = 0;
      for (const m of r.matches) {
        totalUsdCost += m.usdCost;
      }
      r.totalUsdCost = totalUsdCost;
      // gbpProceeds is actually USD proceeds
      const usdProceeds = r.totalProceeds;
      const usdGainLoss = usdProceeds - totalUsdCost;
      // Convert net USD gain/loss to GBP
      r.gainLoss = usdToGbp(usdGainLoss, r.taxYear);
      // Also compute GBP cost and proceeds for display
      r.totalCost = usdToGbp(totalUsdCost, r.taxYear);
      r.totalGbpProceeds = usdToGbp(usdProceeds, r.taxYear);
      EngineInvariants.checkBasisChain(r);
    }

    return {
      disposals: results,
      poolHistory,
      finalPool: { qty: poolQty, usdCost: poolUsd }
    };
  }
};

// ========== CGT CALCULATOR ==========
const CGTCalc = {
  /**
   * Calculate CGT for a given tax year.
   * @param {Array} disposals - from SharePool.compute()
   * @param {string} year - tax year string e.g. "2024/25"
   * @param {number} lossesBroughtForward - pence
   * @returns {object} CGT computation
   */
  compute(disposals, year, lossesBroughtForward) {
    const yearDisposals = disposals.filter(d => d.taxYear === year);
    const aea = AEA[year] || 300000;

    let grossGains = 0;
    let grossLosses = 0;
    const gainDisposals = [];
    const lossDisposals = [];

    for (const d of yearDisposals) {
      if (d.gainLoss >= 0) {
        grossGains += d.gainLoss;
        gainDisposals.push(d);
      } else {
        grossLosses += Math.abs(d.gainLoss);
        lossDisposals.push(d);
      }
    }

    // Net gains after in-year losses
    let netGains = grossGains - grossLosses;

    // Apply losses brought forward — only to reduce to AEA level
    let lossesBfUsed = 0;
    if (netGains > aea && lossesBroughtForward > 0) {
      lossesBfUsed = Math.min(lossesBroughtForward, netGains - aea);
      netGains -= lossesBfUsed;
    }

    // Losses carried forward
    let lossesCarriedForward = lossesBroughtForward - lossesBfUsed;
    // Add in-year net losses to carry forward
    if (grossGains < grossLosses) {
      lossesCarriedForward += grossLosses - grossGains;
    }

    // Taxable gains after AEA
    const taxableGains = Math.max(0, netGains - aea);

    // CGT rate split for 2024/25
    let cgtDue = 0;
    let baseCgt = 0;
    let budgetAdjustment = 0;

    if (taxableGains > 0) {
      if (year === '2024/25') {
        // Split by pre/post budget date.
        // Method: allocate actual pre-budget gains first (capped at taxable),
        // then post-budget gets the remainder.
        let preBudgetGainsTotal = 0;
        for (const d of gainDisposals) {
          const dispDate = parseDate(d.disposal.date);
          if (dispDate < BUDGET_DATE) {
            preBudgetGainsTotal += d.gainLoss;
          }
        }
        // Pre-budget taxable = actual pre-budget gains, capped at total taxable
        const preBudgetTaxable = Math.min(preBudgetGainsTotal, taxableGains);
        const postBudgetTaxable = taxableGains - preBudgetTaxable;

        baseCgt = roundPence(taxableGains * CGT_RATE_PRE_BUDGET / 100);
        const actualCgt = roundPence(preBudgetTaxable * CGT_RATE_PRE_BUDGET / 100)
                        + roundPence(postBudgetTaxable * CGT_RATE_POST_BUDGET / 100);
        budgetAdjustment = actualCgt - baseCgt;
        cgtDue = actualCgt;
      } else if (year >= '2024/25') {
        // All post-budget
        cgtDue = roundPence(taxableGains * CGT_RATE_POST_BUDGET / 100);
      } else {
        // All pre-budget
        cgtDue = roundPence(taxableGains * CGT_RATE_PRE_BUDGET / 100);
      }
    }

    return {
      year,
      disposals: yearDisposals,
      gainDisposals,
      lossDisposals,
      grossGains,
      grossLosses,
      netGains: grossGains - grossLosses,
      lossesBroughtForward,
      lossesBfUsed,
      aea,
      taxableGains,
      baseCgt,
      budgetAdjustment,
      cgtDue,
      lossesCarriedForward,
    };
  }
};


// ========== RENTAL INCOME CALCULATOR ==========
const RentalCalc = {
  compute(year) {
    const data = RENTAL_DATA[year];
    if (!data) {
      return {
        year, grossRent: 0, expenses: 0, taxableProfit: 0,
        mortgageInterest: 0, taxCredit: 0, taxPayable: 0, inactive: true
      };
    }

    const expenses = data.airbnbFees + data.councilTax + data.serviceCharge + data.accountancy;
    const taxableProfit = data.grossRent - expenses;
    const taxCredit = roundPence(data.mortgageInterest * 20 / 100);
    const taxPayable = roundPence(taxableProfit * ADDITIONAL_RATE / 100) - taxCredit;

    return {
      year,
      grossRent: data.grossRent,
      airbnbFees: data.airbnbFees,
      councilTax: data.councilTax,
      serviceCharge: data.serviceCharge,
      accountancy: data.accountancy,
      expenses,
      taxableProfit,
      mortgageInterest: data.mortgageInterest,
      taxCredit,
      taxPayable,
      inactive: false,
    };
  }
};


// ========== PENSION CHECKER ==========
const PensionCalc = {
  /**
   * Calculate pension annual allowance position for a given year
   */
  compute(year) {
    const data = PENSION_DATA[year];
    if (!data) return null;

    const standardAA = PENSION_AA[year] || 6000000;
    const [thresholdLimit, adjustedLimit, minAA] = PENSION_TAPER_THRESHOLDS[year] || [20000000, 26000000, 1000000];

    // Calculate threshold income
    // employeeContrib stores NET contributions for RAS schemes.
    // Gross = net × 100/80. For salary sacrifice, it's the sacrifice amount.
    let grossEmployeeContrib;
    if (data.schemeType === 'relief-at-source') {
      grossEmployeeContrib = roundPence(data.employeeContrib * 100 / 80);
    } else {
      grossEmployeeContrib = data.employeeContrib;
    }

    let thresholdIncome;
    if (data.schemeType === 'relief-at-source') {
      // Deduct gross employee contributions from gross income
      thresholdIncome = data.grossIncome - grossEmployeeContrib;
    } else {
      // Salary sacrifice: already excluded from gross income, no separate deduction
      thresholdIncome = data.grossIncome;
    }

    // Calculate adjusted income
    let adjustedIncome;
    if (data.schemeType === 'relief-at-source') {
      // Add back: employer contributions + gross employee contributions
      adjustedIncome = thresholdIncome + data.employerContrib + grossEmployeeContrib;
    } else {
      // Salary sacrifice: employer contributions (which include the sacrifice) are added
      adjustedIncome = thresholdIncome + data.employerContrib + data.employeeContrib;
    }

    // Calculate tapered AA
    let taperedAA = standardAA;
    if (thresholdIncome > thresholdLimit && adjustedIncome > adjustedLimit) {
      const excess = adjustedIncome - adjustedLimit;
      const reduction = roundPence(excess / 2);
      taperedAA = Math.max(minAA, standardAA - reduction);
    }

    // Total pension input (all contributions that count toward AA)
    // For RAS: gross employee contribution + employer contributions
    // For salary sacrifice: employee sacrifice + employer contributions
    let totalInput = grossEmployeeContrib + data.employerContrib;

    // Add SIPP contributions if any
    let sippGross = 0;
    if (data.sippContrib && data.sippContrib > 0) {
      if (data.sippSchemeType === 'relief-at-source') {
        sippGross = roundPence(data.sippContrib * 100 / 80);
      } else {
        sippGross = data.sippContrib;
      }
      totalInput += sippGross;
    }

    const unusedAA = Math.max(0, taperedAA - totalInput);
    const excess = Math.max(0, totalInput - taperedAA);

    return {
      year,
      grossIncome: data.grossIncome,
      schemeType: data.schemeType,
      employeeContrib: data.employeeContrib,
      employerContrib: data.employerContrib,
      sippContrib: data.sippContrib || 0,
      sippGross,
      standardAA,
      thresholdIncome,
      adjustedIncome,
      taperedAA,
      totalInput,
      unusedAA,
      excess,
    };
  },

  /**
   * Calculate carry-forward available for a given year.
   * Uses the 3 prior years' unused allowances.
   */
  carryForward(year) {
    const years = this.getPriorYears(year, 3);
    const cfYears = [];
    for (const y of years) {
      const result = this.compute(y);
      if (result) {
        cfYears.push({
          year: y,
          taperedAA: result.taperedAA,
          totalInput: result.totalInput,
          unused: result.unusedAA,
        });
      }
    }
    return cfYears;
  },

  getPriorYears(year, count) {
    const startYear = parseInt(year.split('/')[0]);
    const result = [];
    for (let i = count; i >= 1; i--) {
      const y = startYear - i;
      result.push(y + '/' + String(y + 1).slice(2));
    }
    return result;
  },

  /**
   * Calculate max additional SIPP contribution for a year
   */
  maxSIPP(year) {
    const current = this.compute(year);
    if (!current) return 0;

    // Available from current year
    let available = current.unusedAA;

    // Add carry-forward from prior years
    const cf = this.carryForward(year);
    for (const y of cf) {
      available += y.unused;
    }

    return available;
  }
};


// ========== INCOME TAX CALCULATOR ==========
const IncomeTaxCalc = {
  /**
   * Calculate income tax for self-assessment
   */
  compute(year) {
    const emp = EMPLOYMENT_DATA[year];
    if (!emp) return null;

    const rental = RentalCalc.compute(year);
    const pension = PENSION_DATA[year];

    // If rental tax was collected via PAYE code adjustment, the P60 figure
    // already includes rental tax. In that case, include rental in total income
    // so tax bands are correct, but the PAYE figure covers it.
    const rentalProfit = rental.inactive ? 0 : rental.taxableProfit;
    const totalIncome = emp.grossPay + rentalProfit;

    // Personal allowance with taper
    let personalAllowance = PERSONAL_ALLOWANCE;
    if (totalIncome > PA_TAPER_THRESHOLD) {
      const excess = totalIncome - PA_TAPER_THRESHOLD;
      const reduction = roundPence(excess / 2);
      personalAllowance = Math.max(0, personalAllowance - reduction);
    }

    // Basic rate band extension (relief at source pension contributions only)
    // employeeContrib stores NET contributions for RAS schemes
    // Gross up: net × 100/80 to get the gross contribution (which extends all band thresholds)
    let basicRateBandExtension = 0;
    if (pension && pension.schemeType === 'relief-at-source') {
      basicRateBandExtension = roundPence(pension.employeeContrib * 100 / 80);
    }
    // SIPP contributions (relief at source) — sippContrib is NET, gross up
    if (pension && pension.sippContrib && pension.sippSchemeType === 'relief-at-source') {
      basicRateBandExtension += roundPence(pension.sippContrib * 100 / 80);
    }

    // Get the additional rate threshold for this year
    const arThreshold = ADDITIONAL_RATE_THRESHOLD[year] || 12514000;

    // Band extension extends ALL thresholds
    const extendedBasicRateLimit = BASIC_RATE_LIMIT + basicRateBandExtension;
    const extendedARThreshold = arThreshold + basicRateBandExtension;

    // Taxable income
    const taxableIncome = Math.max(0, totalIncome - personalAllowance);

    // Apply tax bands
    let tax = 0;
    let remaining = taxableIncome;

    // Basic rate: 0 to extendedBasicRateLimit
    const basicRateAmount = Math.min(remaining, extendedBasicRateLimit);
    tax += roundPence(basicRateAmount * BASIC_RATE / 100);
    remaining -= basicRateAmount;

    // Higher rate: extendedBasicRateLimit to extendedARThreshold
    const higherRateBand = extendedARThreshold - extendedBasicRateLimit;
    const higherRateAmount = Math.min(remaining, higherRateBand);
    tax += roundPence(higherRateAmount * HIGHER_RATE / 100);
    remaining -= higherRateAmount;

    // Additional rate: above extendedARThreshold
    if (remaining > 0) {
      tax += roundPence(remaining * ADDITIONAL_RATE / 100);
    }

    // Deductions from tax
    // 1. Section 24 mortgage interest credit
    const s24Credit = rental.inactive ? 0 : rental.taxCredit;

    // 2. SIPP higher/additional rate relief
    let sippRelief = 0;
    if (pension && pension.sippContrib && pension.sippSchemeType === 'relief-at-source') {
      const sippGross = roundPence(pension.sippContrib * 100 / 80);
      // Additional rate relief: gross × 25% (45% - 20% already claimed)
      sippRelief = roundPence(sippGross * 25 / 100);
    }

    const grossTax = tax;
    const taxAfterDeductions = grossTax - s24Credit - sippRelief;

    // Net position
    const netUnderpayment = taxAfterDeductions - emp.taxPaid;

    return {
      year,
      employmentIncome: emp.grossPay,
      rentalProfit: rental.inactive ? 0 : rental.taxableProfit,
      totalIncome,
      personalAllowance,
      basicRateBandExtension,
      extendedBasicRateLimit,
      extendedARThreshold,
      taxableIncome,
      basicRateAmount,
      higherRateAmount,
      additionalRateAmount: remaining,
      grossTax,
      s24Credit,
      sippRelief,
      taxAfterDeductions,
      taxPaid: emp.taxPaid,
      netUnderpayment,
    };
  }
};
// ========== SELF-ASSESSMENT SUMMARY ==========
const SelfAssessment = {
  compute(year) {
    // Run all engines
    const poolResult = SharePool.compute(TRANSACTIONS, HMRC_RATES);

    // Calculate CGT with loss carry-forward chain
    const yearsToProcess = ['2022/23', '2023/24', '2024/25', '2025/26'];
    let lossesBf = 0;
    const cgtResults = {};
    for (const y of yearsToProcess) {
      const cgt = CGTCalc.compute(poolResult.disposals, y, lossesBf);
      cgtResults[y] = cgt;
      lossesBf = cgt.lossesCarriedForward;
    }

    const cgt = cgtResults[year];
    const incomeTax = IncomeTaxCalc.compute(year);
    const rental = RentalCalc.compute(year);
    const pension = PensionCalc.compute(year);

    if (!incomeTax || !cgt) return null;

    const totalLiability = Math.max(0, incomeTax.netUnderpayment) + cgt.cgtDue;

    // Payments on account
    // Required if SA liability (excl CGT) > £1,000 AND > 20% of total income tax
    const saLiabilityExclCGT = Math.max(0, incomeTax.netUnderpayment);
    const poaRequired = saLiabilityExclCGT > p(1000) &&
                        saLiabilityExclCGT > roundPence(incomeTax.grossTax * 20 / 100);
    const poaAmount = poaRequired ? roundPence(saLiabilityExclCGT / 2) : 0;

    return {
      year,
      incomeTax,
      cgt,
      rental,
      pension,
      totalLiability,
      poaRequired,
      poaAmount,
      poolResult,
      allCgtResults: cgtResults,
      runManifest: CalibrationConfig.generateRunManifest(year),
      auditTrail: CalibrationConfig.getAuditTrail(year),
      invariantErrors: EngineInvariants.getErrors(),
      computationMode: CalibrationConfig.mode,
    };
  }
};
// ========== TEST SUITE ==========
const Tests = {
  results: [],
  pass: 0,
  fail: 0,

  assert(condition, label, expected, actual) {
    const passed = condition;
    this.results.push({ passed, label, expected, actual });
    if (passed) this.pass++; else this.fail++;
  },

  assertPence(actual, expected, label) {
    // Allow 1p tolerance for rounding
    const diff = Math.abs(actual - expected);
    this.assert(diff <= 1, label, fmt(expected), fmt(actual));
  },

  assertExact(actual, expected, label) {
    this.assert(actual === expected, label, expected, actual);
  },

  run() {
    this.results = [];
    this.pass = 0;
    this.fail = 0;

    const poolResult = SharePool.compute(TRANSACTIONS, HMRC_RATES);

    // ===== PHASE 1: SHARE POOL =====
    this.results.push({ section: 'Share Pool Engine' });

    // Pool end-states
    // Need to find pool state at end of each tax year
    // End of 2022/23 = after all transactions up to 5 April 2023
    const poolAtEndOf = (year) => {
      const endYear = parseInt(year.split('/')[0]) + 1;
      const endDate = `${endYear}-04-05`;
      let lastEntry = null;
      for (const entry of poolResult.poolHistory) {
        if (entry.date <= endDate) lastEntry = entry;
      }
      return lastEntry;
    };

    const pool2223 = poolAtEndOf('2022/23');
    this.assertExact(pool2223?.poolQty, 3259, 'Pool qty end 2022/23: 3,259 shares');

    const pool2324 = poolAtEndOf('2023/24');
    this.assertExact(pool2324?.poolQty, 3833, 'Pool qty end 2023/24: 3,833 shares');

    const pool2425 = poolAtEndOf('2024/25');
    this.assertExact(pool2425?.poolQty, 4211, 'Pool qty end 2024/25: 4,211 shares');
    // USD pool: 4,211 shares at avg $79.40/share
    this.assert(
      Math.abs(pool2425.poolUsd / pool2425.poolQty / 100 - 79.40) < 0.01,
      'Pool avg USD cost end 2024/25: $79.40',
      '$79.40',
      '$' + (pool2425.poolUsd / pool2425.poolQty / 100).toFixed(2)
    );

    // B&B match verification for 2022/23
    const disp1305 = poolResult.disposals.find(d =>
      d.disposal.date === '2022-05-13' && d.disposal.qty === 330);
    if (disp1305) {
      const bbMatch = disp1305.matches.find(m => m.rule === 'bed-and-breakfast');
      this.assert(!!bbMatch, '13 May 2022 sale: B&B match applied', 'B&B', bbMatch?.rule || 'none');
      if (bbMatch) {
        this.assertExact(bbMatch.qty, 330, '13 May 2022 B&B: 330 shares matched');
      }
    } else {
      this.assert(false, '13 May 2022 disposal found', 'found', 'not found');
    }

    // B&B match verification for 2024/25 (14 May 2024)
    const disp1405 = poolResult.disposals.find(d =>
      d.disposal.date === '2024-05-14' && d.disposal.qty === 314);
    if (disp1405) {
      const bbMatch = disp1405.matches.find(m => m.rule === 'bed-and-breakfast');
      this.assert(!!bbMatch, '14 May 2024 sale (314): B&B match applied', 'B&B', bbMatch?.rule || 'none');
      if (bbMatch) {
        this.assertExact(bbMatch.qty, 314, '14 May 2024 B&B: 314 shares matched');
      }
    } else {
      this.assert(false, '14 May 2024 disposal (314) found', 'found', 'not found');
    }

    // ===== PHASE 2: CGT =====
    this.results.push({ section: 'CGT Calculator' });

    // Process CGT with carry-forward chain
    let lossesBf = 0;
    const cgt2223 = CGTCalc.compute(poolResult.disposals, '2022/23', lossesBf);
    lossesBf = cgt2223.lossesCarriedForward;

    // Filed return figures (with ±£2 tolerance for HMRC rate rounding)
    this.assert(Math.abs(cgt2223.grossGains - p(4705)) <= p(2), '2022/23 gross gains: ~£4,705',
      '£4,705', fmt(cgt2223.grossGains));
    this.assert(Math.abs(cgt2223.grossLosses - p(2963)) <= p(2), '2022/23 gross losses: ~£2,963',
      '£2,963', fmt(cgt2223.grossLosses));
    this.assertPence(cgt2223.taxableGains, 0, '2022/23 taxable gains: £0');
    this.assertPence(cgt2223.cgtDue, 0, '2022/23 CGT due: £0');

    const cgt2324 = CGTCalc.compute(poolResult.disposals, '2023/24', lossesBf);
    lossesBf = cgt2324.lossesCarriedForward;

    const it2223 = IncomeTaxCalc.compute('2022/23');

    // 2023/24

    this.assertPence(it2324.netUnderpayment, p(84.95), '2023/24 IT underpayment: £84.95');

    // 2024/25
    const it2425 = IncomeTaxCalc.compute('2024/25');
    const rentalTax2425 = roundPence(rent2425.taxableProfit * 45 / 100) - rent2425.taxCredit;
    // Total liability = IT underpayment + CGT
    const total2223 = Math.max(0, it2223.netUnderpayment) + cgt2223.cgtDue;
    const total2324 = Math.max(0, it2324.netUnderpayment) + cgt2324.cgtDue;
    const total2425 = Math.max(0, it2425.netUnderpayment) + cgt2425.cgtDue;

    // IT breakdown for 2024/25
    this.assertPence(it2425.netUnderpayment, p(4211.05), '2024/25 IT underpayment: £4,211.05');

    return {
      results: this.results,
      pass: this.pass,
      fail: this.fail,
      total: this.pass + this.fail,

  }
};

    const poolResult = SharePool.compute(transactions, hmrcRates || HMRC_RATES);
    return poolResult;
  },

  runCase(name, fn) {
    this.results.push({ section: name });
    try {
      fn();
    } catch (e) {
      this.results.push({ passed: false, label: 'EXCEPTION: ' + e.message, expected: 'no error', actual: e.message });
      this.fail++;
    }
  },

  assert(condition, label, expected, actual) {
    const passed = !!condition;
    this.results.push({ passed, label, expected: String(expected), actual: String(actual) });
    if (passed) this.pass++; else this.fail++;
  },

  assertExact(actual, expected, label) {
    this.assert(actual === expected, label, expected, actual);
  },

    const diff = Math.abs(actual - expected);
    this.assert(diff <= tolerance, label, expected, actual);
